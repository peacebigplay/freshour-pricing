# Render.com — กด "New Blueprint" ชี้ repo นี้ · ใส่ค่า env ที่ sync:false ในหน้า dashboard
services:
  - type: web
    name: freshour-pricing
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: freshour-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: FH_SECRET
        generateValue: true
      - key: FH_PINS
        sync: false
      - key: LINE_CHANNEL_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_ADMIN_USER_ID
        sync: false
      - key: MARKET_FEED_URL
        sync: false
      - key: FH_INBOX_DIR
        value: /app/data/inbox
