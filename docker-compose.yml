services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: freshour
      POSTGRES_PASSWORD: freshour
      POSTGRES_DB: freshour
    ports:
      - '5432:5432'
    volumes:
      - freshour_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U freshour']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://freshour:freshour@db:5432/freshour?schema=public}
      AUTH_SECRET: ${AUTH_SECRET:?set a long random AUTH_SECRET in .env}
      SESSION_TTL_SECONDS: '28800'
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      NODE_ENV: production
    ports:
      - '3000:3000'

  # One-off tooling: runs prisma/seed.ts (needs `tsx`, which the `app`
  # service's CMD doesn't use) from the same `builder` stage the app image
  # is built from. Usage: `docker compose run --rm seed`.
  # Override DATABASE_URL on the command line (e.g.
  # `DATABASE_URL=<remote-url> docker compose run --rm seed`) to seed a
  # remotely-hosted database (see docs/DEPLOYMENT.md "Deploying for your
  # team") instead of the local `db` service.
  seed:
    build:
      context: .
      target: builder
    profiles: ['tools']
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://freshour:freshour@db:5432/freshour?schema=public}
      AUTH_SECRET: ${AUTH_SECRET:?set a long random AUTH_SECRET in .env}
    command: npx tsx prisma/seed.ts

volumes:
  freshour_db_data:
