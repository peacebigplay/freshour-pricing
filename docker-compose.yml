services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: freshour
      POSTGRES_PASSWORD: freshour
      POSTGRES_DB: freshour
    ports:
      - '5432:5432'
    volumes:
      - freshour_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U freshour']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://freshour:freshour@db:5432/freshour?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?set a long random AUTH_SECRET in .env}
      SESSION_TTL_SECONDS: '28800'
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      NODE_ENV: production
    ports:
      - '3000:3000'
    command: sh -c "npx prisma migrate deploy && npx next start -p 3000"

volumes:
  freshour_db_data:
