# Fly.io — fly launch --copy-config · fly volumes create freshour_data --size 1 · fly secrets set LINE_CHANNEL_TOKEN=... LINE_CHANNEL_SECRET=... LINE_ADMIN_USER_ID=... LINE_STAFF_USER_IDS=...
# บัญชีผู้ใช้: fly ssh console → node tools/users.js add <id> --role admin --name "ชื่อ" (เก็บบน volume /app/data/var)
app = "freshour-pricing"
primary_region = "sin"

[build]

[env]
  PORT = "8787"
  FH_SECURE = "1"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = false
  min_machines_running = 1

[[http_service.checks]]
  interval = "60s"
  timeout = "5s"
  method = "GET"
  path = "/healthz"

[mounts]
  source = "freshour_data"
  destination = "/app/data/var"
