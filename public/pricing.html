<!doctype html><html lang="th"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ตั้งราคา · Freshour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/peach.css">
</head><body>
<script src="/peach.js"></script>
<script src="/charts.js"></script>
<script src="/dash.js"></script>
<script src="/aiperf.js"></script>
<script>
/* โต๊ะตั้งราคา — งานวันพุธของพี่จุ๋ม
   ของจริง 78% ของสินค้าขายให้เจ้าเดียว งานจึงเป็น "ใบละเจ้า 43 ใบ" ไม่ใช่กระดานเดียว 363 แถว
   เปิดมาเจอกองใบก่อน เลือกใบแล้วค่อยไล่ทีละรายการ */
var esc = PX.esc, money = PX.money, W = PX.why;
/* ค่าที่ใส่ใน onclick ต้องเป็นสตริง JS ที่ปลอดภัยทั้งในฐานะ JS และ attribute — รหัส/กลุ่มสินค้ามาจากคนพิมพ์ได้ */
function jsq(v) { return JSON.stringify(String(v == null ? '' : v)).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
var GD = null, EXC = {}, SAVING = false, SEL = {};   /* EXC = เหตุผลข้อยกเว้นของแถวที่ยืนยันต่ำกว่าขั้นต่ำ */
var D = null, CUST = '', CQ = '', Q = '', EDIT = {}, ALL = false, VIEW = 'home', G = 'ทั้งหมด', REQ = null, NEGO = null, EDITR = {}, EDIT5 = {}, EDIT10 = {}, UNPRICED = 'SUGGEST', STRATEGY = 'rec', SORT = 'crisis', CSORT = 'orders', CONF = {}, LASTSAVE = '', PAGE = 0, PER = 20, CUSTOMER_CACHE = {}, HANDED = {};
var PREV_PERIOD = '03–09/09', CUR_PERIOD = '10–16/09';

(function () {
  var q = new URLSearchParams(__NAV.search);
  if (q.get('cust')) CUST = q.get('cust');
  if (q.get('q')) Q = q.get('q');
})();

PX.shell('pricing',
  '<div class="float"><div class="ic">🧮</div><b>กองใบราคา</b>' +
  '<span id="floatSub">กำลังอ่าน…</span>' +
  '<button onclick="goHome()">Pricing Home</button></div>');

function deskURL() { return '/api/desk' + (CUST ? '?customer=' + encodeURIComponent(CUST) : ''); }

/* ── ⚠ ตรงนี้เคยเป็น "Prototype data hydration" ของไฟล์เดโม ──────────
   ในไฟล์เดโมมันเติมช่องที่ว่างให้ครบ เพื่อให้กดเล่นได้ทุกแถวโดยไม่เจอช่องเปล่า
   แต่บนเว็บจริงมันคือการ "แต่งข้อมูล" — ตอนย้ายมาครั้งแรกทำให้
     · ราคาตลาดขึ้น 363/363 ทั้งที่ของจริงรู้แค่ 1 รายการ
     · ปริมาณขายถูกสุ่มใส่ กำไร/สัปดาห์เลยขึ้น 569,314 แทนที่จะเป็น 74,475
     · ทุน ราคากระดาน จุดคุ้ม เพดานเซลล์ ถูกเติมให้ครบทั้งที่ยังไม่รู้
   ช่องว่างคือความจริงของระบบนี้ — มันคืองานที่ยังไม่ได้ทำ ห้ามกลบ
   ถ้าจะกลับไปใช้ในไฟล์เดโม ให้ก๊อปจาก Freshour-ทุกหน้า-ให้พีชแก้.html */
function hydrateBase(j) {
  if (j && !(j.targetPct > 0)) j.targetPct = 15;
  return j;
}

/* แถวที่ยืนยันไว้แต่ "บริบทเปลี่ยน" (ทุน/ราคากลางเปลี่ยนหลังบันทึก) = ยังไม่ถือว่ายืนยัน ต้องดูใหม่ */
function staleRow(r) {
  var v = V(r);
  return CUST ? !!(v.baseChanged || v.costChanged || v.baseApproved === false)
              : !!(v.central && v.central.state !== 'approved');
}
function load(msg) {
  var want = CUST;
  return PX.get(deskURL())
    .then(function (j) {
      /* กดสลับเจ้าเร็ว ๆ แล้วคำตอบเก่ามาถึงทีหลัง = ทิ้ง (ไม่งั้นจอเป็นเจ้า B แต่ข้อมูลเป็นเจ้า A) */
      if (want !== CUST) return 'skip';
      D = hydrateBase(j);
      CUR_PERIOD = D.round || D.asOf || 'รอบนี้';
      PREV_PERIOD = D.prevRound || 'รอบก่อน';
      (D.customers || []).forEach(function(c){ CUSTOMER_CACHE[c.id] = Object.assign({}, c); });
      /* แถวที่ยืนยันไว้แล้ว (และทุนยังไม่เปลี่ยน) ถือว่ายืนยันแล้วตั้งแต่เปิดหน้า — ไล่ยืนยันซ้ำทุกครั้งไม่ได้ */
      /* แถวที่บริบทเปลี่ยน (ทุน/ราคากลาง) ต้องกลับไปรอยืนยัน แม้เคยติ๊กไว้บนจอก่อนโหลดใหม่ */
      rowsInView().forEach(function (r) { if (staleRow(r)) delete CONF[r.id];
        else if (approvedPrice(r) != null && CONF[r.id] == null) CONF[r.id] = true; });
      /* ข้อมูลเสริมสองก้อนนี้ล้มได้โดยไม่กระทบใบ — แต่ใบหลักล้มต้องไม่ถูกกลืนไปด้วย (เดิม catch ตัวเดียวกลืนทั้งหมด) */
      return Promise.all([
        PX.get('/api/guard').then(function (g) { GD = g; }, function () { GD = null; }),
        PX.get('/api/price-requests').then(function (r) { REQ = r; }, function () { REQ = null; }),
        PX.get('/api/negotiations').then(function (r) { NEGO = r; }, function () { NEGO = null; }),
        (!CUST ? AIPerf.load(true).then(null, function () {}) : null)
      ]);
    }, function (e) {
      if (want !== CUST) return 'skip';
      /* โหลดใบของเจ้านี้ไม่ได้ — ล้างข้อมูลเก่าออกจากจอ กันกดบันทึกแล้วราคาเจ้าก่อนหน้าไปลงเจ้านี้ */
      D = null; EDIT = {}; SEL = {}; CONF = {}; EXC = {};
      document.getElementById('main').innerHTML = '<div class="card" style="margin-top:16px;padding:20px">' +
        '<b>โหลดข้อมูลไม่สำเร็จ</b><p class="hint" style="margin:6px 0 12px">' + esc(e.message) + '</p>' +
        '<button class="btn pri" onclick="load()">ลองใหม่</button> <button class="btn" onclick="goHome()">กลับหน้าแรก</button></div>';
      return 'failed';
    })
    .then(function (st) { if (st === 'skip' || st === 'failed' || !D) return; draw(); if (msg) PX.toast(msg); });
}
function pick(id) { CUST = id; VIEW = 'customer-detail'; EDIT = {}; SEL = {}; CONF = {}; Q = ''; G = 'ทั้งหมด'; ALL = false; PAGE = 0; load(); }
function goHome() { VIEW = 'home'; CUST = ''; EDIT = {}; SEL = {}; CONF = {}; Q = ''; CQ = ''; G = 'ทั้งหมด'; ALL = false; PAGE = 0; load(); }
function openCustomerList() { VIEW = 'customers'; CUST = ''; EDIT = {}; SEL = {}; CONF = {}; Q = ''; G = 'ทั้งหมด'; ALL = false; PAGE = 0; load(); }
function backStack() {
  if (VIEW === 'customer-detail' || CUST) { CUST = ''; VIEW = 'customers'; }
  else if (VIEW === 'board') { VIEW = 'home'; ALL = false; }
  else { VIEW = 'home'; }
  EDIT = {}; SEL = {}; CONF = {}; Q = ''; G = 'ทั้งหมด'; PAGE = 0; load();
}

/* ราคาที่จะออกของแถวนี้ — แก้ค้างไว้ใน EDIT ก่อนบันทึก */
function basePrice(r) {
  var a = approvedPrice(r); if (a != null) return a;
  var g = goalOf(r); if (g && g.price > 0) return g.price;   /* Goal ที่ไม่มีราคา (เช่น แข่งขันได้ แต่ไม่รู้ตลาด) ห้ามคืน undefined ลงช่องราคา */
  return (CUST && r.cust) ? r.cust.price : r.w2;
}
function priceOf(r) { return EDIT[r.id] != null ? EDIT[r.id] : basePrice(r); }
/* ราคาปลีก / ส่ง 5kg / 10kg ตามใบราคา AL: ปลีก = ⌈ทุน×markup⌉ · 5kg = 2kg−3 · 10kg = 2kg−4 · ตัวที่ใบตั้งเอง (override) คงค่าไว้ · แก้บนจอได้ */
function tierOverride(r, k) { var t = V(r).tiers; if (!t) return false; if (k === 'retail') return r.cost > 0 && t.retail !== Math.ceil(r.cost * (D.markup || 1.6) - 1e-9); if (k === 's5') return t.s5 !== t.w2 + (D.k5 == null ? -3 : D.k5); return t.s10 !== t.w2 + (D.k10 == null ? -4 : D.k10); }
function retailOf(r) { if (EDITR[r.id] != null) return EDITR[r.id]; var t = V(r).tiers; if (t && tierOverride(r, 'retail')) return t.retail; return r.cost > 0 ? Math.ceil(r.cost * (D.markup || 1.6) - 1e-9) : (r.retail || 0); }
function tierOf(r, k, p) { var m = k === 's5' ? EDIT5 : EDIT10; if (m[r.id] != null) return m[r.id]; var t = V(r).tiers; if (t && tierOverride(r, k)) return t[k]; return p + (k === 's5' ? (D.k5 == null ? -3 : D.k5) : (D.k10 == null ? -4 : D.k10)); }
function mgOf(r, px) { return px > 0 ? Math.round((px - r.cost) / px * 1000) / 10 : 0; }
function prevOf(r) { return CUST ? (V(r).prevCustomer || 0) : (r.prev || 0); }

/* ราคาตลาดที่ยังใช้ตัดสินได้ — หมดอายุแล้วใช้ฟ้องไม่ได้ */
function mkt(r) { return (r.cheapest && !r.cheapest.stale) ? r.cheapest : null; }

/* เห็นราคานั้นมากี่วันแล้ว — กฎอายุ 30 วันทั้งกฎแขวนอยู่กับเลขนี้
   ตอนย้ายดีไซน์เคยตัดทิ้ง เหลือแต่ชื่อเจ้า คนเลยเทียบกับของเก่า 27 วันโดยไม่รู้ตัว */
function ageOf(r) {
  if (!r.cheapest) return '';
  var m = (r.marks || []).filter(function (x) { return x.price === r.cheapest.price; })[0];
  if (!m || m.age == null) return '';
  return m.age === 0 ? 'วันนี้' : 'เห็นเมื่อ ' + m.age + ' วัน';
}


/* ── Pricing Strategy v2 ───────────────────────────────────────────
   เป้าคือให้ระบบ "เสนอ" และให้คนตรวจ exception แทนการไล่คิดทุกแถว
   สูตรจริงควรอยู่ backend endpoint เดียว เช่น /api/price-suggestions เพื่อให้เว็บ/cron ใช้กฎเดียวกัน */
var STRATS = {
  rec:         { name: 'แนะนำ (ระบบ)', note: 'ระบบเลือกให้จาก Target margin ของกลุ่ม · ราคาตลาดที่ยังสด (≤30 วัน) · ราคาเดิม — ไม่ต่ำกว่า Minimum · เหตุผลดูที่ Logic →' },
  target:      { name: 'กำไรตามเป้า', note: 'ทุน ÷ (1 − Target margin ของกลุ่มสินค้า) ปัดขึ้น' },
  hold:        { name: 'ยืนราคาเดิม', note: 'ราคาเดิม (ราคากลางที่ยืนยันไว้ / ใบราคาปัจจุบัน) — ต่ำกว่า Minimum จะเตือน ไม่ยกขึ้นเอง' },
  competitive: { name: 'แข่งขันได้',  note: 'ราคาตลาด (ส่ง) อายุ ≤30 วัน ถูกสุด − 1 ฿ — ตลาดเก่าเกิน 30 วัน (Stale) ไม่ใช้คิด' },
  protect:     { name: 'ป้องกันกำไร', note: 'ทุน ÷ (1 − Minimum margin) ปัดขึ้น — Safety Floor ราคาต่ำสุดที่ยอมรับได้' }
};
var CSTATE = { review_required: 'Pricing Review Required — ทุนเปลี่ยนหลังยืนยัน', margin_at_risk: 'Margin at Risk — ทุนใหม่ทำให้ราคาที่ยืนยันต่ำกว่า Minimum', policy_changed: 'Pricing Policy Changed — เป้ากลุ่มเปลี่ยน', stale: 'ทุนเปลี่ยนหลังยืนยัน' };
function centralStateText(v) { var c = v.central || {}, t = CSTATE[c.state] || c.state; return t + (c.impact ? ' (' + Math.round(c.price) + ' ฿ · margin ' + c.impact.margin_before + '% → ' + c.impact.margin_after + '%)' : ' (' + Math.round(c.price) + ' ฿)') + ' — ยืนยันใหม่'; }
function centralStateShort(v) { var c = v.central || {}; return ({ review_required: 'ทุนเปลี่ยน ตรวจใหม่', margin_at_risk: 'Margin at Risk', policy_changed: 'นโยบายเปลี่ยน', stale: 'ทุนเปลี่ยน' }[c.state] || c.state) + ' · เดิม ' + Math.round(c.price) + ' ฿'; }
function recGoal(r) { var x = V(r).rec; return x ? { price: x.price, rawResult: x.price, margin: x.margin, why: 'แนะนำ → ' + (STRATS[x.strategy] || {}).name + ' · ' + x.why[x.why.length - 1], strategy: x.strategy, state: x.state, stateText: x.stateText } : null; }
function setStrategy(k) {
  STRATEGY = k; EDIT = {}; SEL = {};   /* เปลี่ยน Goal ทั้งใบ = ล้างที่เลือกรายแถวด้วย ไม่งั้นราคาใหม่แต่ไฮไลต์ปุ่มเก่า */
  rowsInView().forEach(function (r) { if (approvedPrice(r) == null) CONF[r.id] = false; });
  draw();
  PX.toast('Goal <b>' + esc(STRATS[k].name) + '</b> · ราคาแนะนำคิดใหม่ทุกแถวที่ยังไม่ยืนยัน');
}


function sourceLabel(r) {
  var m = V(r).market || {};
  return m.n ? 'ตลาด ' + m.low + '–' + m.high + ' ฿ · median ' + m.median + ' ฿' : 'ไม่มีราคาตลาดที่ยังใช้ได้ · ใช้ทุน + เป้าหมวด';
}



function goalControl() {
  var cc = D.centralCount || {};
  return '<div class="goalbar"><span class="glb">Goal การตั้งราคา</span>' +
    Object.keys(STRATS).map(function(k){
      return '<button class="tab' + (STRATEGY===k?' on':'') + '" title="' + esc(STRATS[k].note) + '" onclick="setStrategy('+jsq(k)+')">' +
        esc(STRATS[k].name) + '</button>';
    }).join('') +
    '<button class="lnk3" style="margin-left:6px" onclick="applyGoalAll()">ใช้กับทุกแถว (รวมที่ยืนยันแล้ว)</button>' +
    '<span class="ghelp">Target/Minimum ตามนโยบายกลุ่มสินค้า (Policy) · ขั้นต่ำ = ทุน ÷ (1 − Minimum) · ' +
      (CUST ? 'ฐาน = ราคากลางที่ยืนยันแล้ว' : 'ยืนยันแล้ว ' + (cc.approved || 0) + ' · ต้องยืนยัน ' + (cc.need || 0) +
        (cc.stale ? ' · <b style="color:var(--amber)">ตรวจราคาใหม่ ' + cc.stale + '</b>' : '') + (cc.waiting ? ' · <b style="color:var(--red)">รอทุน ' + cc.waiting + '</b>' : '')) + '</span></div>';
}
function csort(v){ CSORT=v; draw(); }
function setSort(v){ SORT=v; PAGE=0; draw(); }
function setPage(v){ PAGE=Math.max(0,v); draw(); window.scrollTo(0,document.querySelector('.tw2')?document.querySelector('.tw2').offsetTop-20:0); }
function goCosts(view){ __NAV.href= view === 'market' ? '/costs?only=nomkt' : '/costs'; }
function customerOrders(c){ return c.orders || c.orderCount || c.contractItems || c.lines || 0; }
function customerKg(c){
  var v = c.kg || c.volume || c.vol || 0;
  return v > 0 ? money(v) + ' kg/รอบ' : '— kg/รอบ';
}
function sortCustomers(a,b){
  if (CSORT==='az') return a.name.localeCompare(b.name,'en');
  if (CSORT==='th') return a.name.localeCompare(b.name,'th');
  return customerOrders(b)-customerOrders(a);
}
function sortRows(a,b){
  if (SORT==='az') return a.name.localeCompare(b.name,'en');
  if (SORT==='th') return a.name.localeCompare(b.name,'th');
  if (SORT==='orders') return (b.vol||0)-(a.vol||0);
  var wa=needsWork(a)?1:0, wb=needsWork(b)?1:0;
  if (wa!==wb) return wb-wa;
  var ra=(D.floorPct||12)-mgOf(a,priceOf(a)), rb=(D.floorPct||12)-mgOf(b,priceOf(b));
  if (ra!==rb) return rb-ra;
  return (b.costJump||0)-(a.costJump||0);
}
function confirmedCount(rows){ return rows.filter(function(r){ return !!CONF[r.id]; }).length; }
/* ขั้นต่ำ 12% ของทุน (เจ้านี้ถ้าเป็นใบรายเจ้า) — ต่ำกว่านี้ server ไม่รับไม่ว่าใคร (สเปก V21 §7) */
function floorOfRow(r) { var c = Number(r.cost) || 0, t = Number(D.floorPct) || 12; return c > 0 ? Math.ceil(c / (1 - t / 100) - 1e-9) : 0; }
function confirmRow(id){
  var r = D.rows.filter(function (x) { return x.id === id; })[0]; if (!r) return;
  if (CUST && V(r).baseApproved === false) {
    PX.toast('ราคากลางของ ' + esc(r.name) + ' ยังไม่ยืนยัน — ยืนยันใน Step 1 ก่อน แล้วค่อยยืนยันใบรายเจ้า', 'bad'); return;
  }
  var f12 = floorOfRow(r);
  if (f12 && priceOf(r) < f12) {
    PX.toast('ราคา ' + priceOf(r) + ' ฿ ต่ำกว่าขั้นต่ำ ' + (D.floorPct || 12) + '% (' + f12 + ' ฿) — ยืนยันไม่ได้ทุกกรณี · ใช้ Goal หรือพิมพ์ราคา ≥ ' + f12 + ' ฿', 'bad');
    return;
  }
  if (belowGuard(r) && !EXC[id]) {
    PX.modal({ title: 'ต่ำกว่าขั้นต่ำ · ' + r.name,
      sub: 'ราคา ' + priceOf(r) + ' ฿ ต่ำกว่าขั้นต่ำ ' + guardOf(r) + ' ฿ (' + esc((V(r).category || {}).name || '') + ' ' + V(r).effectivePct + '%)',
      fields: [{ k: 'why', label: 'เหตุผลข้อยกเว้น (บังคับ)', type: 'area', rows: 2, ph: 'เช่น ตัวชูโรงของเจ้านี้ · สู้เจ้าอื่นที่ให้ 185' }],
      okText: 'ยืนยันเป็นข้อยกเว้น',
      onOk: function (v, close) {
        if (String(v.why || '').trim().length < 3) { PX.toast('ต้องใส่เหตุผลอย่างน้อยสั้นๆ', 'bad'); return false; }
        EXC[id] = String(v.why).trim(); CONF[id] = true; close(); draw();
      } });
    return;
  }
  CONF[id] = true; draw();
}
function confirmNormal(){
  var n = 0;
  rowsInView().forEach(function(r){ if (V(r).goals && !needsWork(r) && !CONF[r.id]) { CONF[r.id] = true; n++; } });
  draw(); PX.toast('ยืนยันรายการปกติ ' + n + ' แถว — เหลือเฉพาะรายการที่ต้องตัดสินใจ');
}
function formatStamp(){
  var d=new Date();
  var z=function(n){return String(n).padStart(2,'0');};
  return z(d.getDate())+'/'+z(d.getMonth()+1)+'/'+d.getFullYear()+' · '+z(d.getHours())+':'+z(d.getMinutes());
}
function saveSheet(){
  var rows = rowsInView().filter(function (r) { return V(r).goals; });   /* ไม่รู้ทุน = ยืนยันไม่ได้ */
  var ok = confirmedCount(rows);
  if (ok < rows.length) {
    PX.toast('ยังยืนยันราคาไม่ครบ — เหลือ <b>' + (rows.length - ok) + '</b> รายการ', 'bad');

function needsWork(r) {
  var p = priceOf(r), pv = prevOf(r), v = V(r);
  if (!v.goals) return false;                                  /* ไม่รู้ทุน — ไปติดด่านทุนแทน */

  if (!CUST && v.central && v.central.state !== 'approved') return true;
  if (CUST && v.baseApproved === false) return true;                 /* ฐานยังไม่ยืนยัน */
  if (CUST && v.baseChanged) return true;                              /* ราคากลางเปลี่ยนหลังบันทึก */

  return false;
}

    '<button class="tab' + (SENT ? ' on' : '') + '" onclick="seeSent(true)">ส่งให้ Sales แล้ว (' + handedN + ')</button>' +
    '<input id="cfind" class="btn" style="min-width:210px;font-weight:400" placeholder="ค้นชื่อลูกค้า…" value="' + esc(CQ) + '">' +
    '<span class="sortline" style="margin-left:auto"><span class="slb">เรียงตาม</span>' +
      [['az','ชื่อ A–Z'],['th','ชื่อ ก–ฮ'],['orders','จำนวนออเดอร์']].map(function(x){
        return '<button class="tab'+(CSORT===x[0]?' on':'')+'" onclick="csort('+jsq(x[0])+')">'+x[1]+'</button>';
      }).join('') + '</span></div>';

  h += '<div class="cgrid">' + cs.map(function (c) {
    /* นับจากด่านเดียวกับปุ่มส่งต่อ: ขาด = ยังไม่บันทึก · ไม่สด = บันทึกแล้วแต่ทุน/ราคากลางเปลี่ยน */
    var gm = c.gateMissing || 0, gs = c.gateStale || 0, gl = c.lines || 0;
    var approved=Math.max(0, gl - gm - gs), pct=gl?Math.round(approved/gl*100):100;
    /* ยังไม่เคยประกาศ = ยังไม่มีรอบให้ตรวจ ห้ามขึ้นว่าพร้อม (เดิมด่านว่าง = ผ่าน) · ต้องมีบรรทัดที่บันทึกจริง */
    if (!D.round) { approved = Math.min(gl, c.priced || 0); pct = gl ? Math.round(approved / gl * 100) : 0; }
    var ready = !!D.round && gl > 0 && gm === 0 && gs === 0 && (c.priced || 0) > 0;
    var hasRisk=(c.low||0)>0;
    return '<button class="cc lv' + (c.work===0 ? 2 : hasRisk ? 0 : 1) + '" onclick="pick(' +
      jsq(c.id) + ')">' +
      '<span class="tag">ลูกค้า</span>' +
      (hasRisk?'<span class="riskflag">⚠ ต้องดู '+c.low+'</span>':'') +
      '<div class="nm" title="'+esc(c.name)+'">'+esc(c.name)+'</div>' +
      '<div class="meta2"><span>ส่ง <b>'+customerKg(c)+'</b></span><span>ออเดอร์ <b>'+customerOrders(c)+'</b></span></div>' +
      '<div class="approveinfo"><span>บันทึกรอบนี้ <b>'+approved+'/'+c.lines+'</b></span><span><b>'+pct+'%</b></span></div>' +
      '<span class="bar" style="display:block;height:6px;background:var(--line-2);border-radius:99px;margin-top:6px;overflow:hidden">' +
        '<i style="display:block;height:100%;width:'+pct+'%;background:'+(pct===100?'var(--green)':'var(--blue)')+';border-radius:99px"></i></span>' +
      '<div class="row3"><div><div class="big" style="font-size:18px;color:'+(c.work===0?'var(--green)':'var(--red)')+'">' +
        (c.handed&&!gs?'✓':ready?'→':c.work)+'</div><div class="u">'+(c.handed&&gs?'ส่งแล้วแต่ทุน/ราคากลางเปลี่ยน · ยืนยันใหม่ '+gs:c.handed?'ส่ง Sales แล้ว':ready?'บันทึกครบ · ส่ง Sales ได้':gs?'ทุน/ราคากลางเปลี่ยน ต้องยืนยันใหม่ '+gs:'รายการต้องตรวจ')+'</div></div>' +
        '<div class="mg2"><b style="color:'+(c.margin<D.floorPct?'var(--red)':c.margin<(D.targetPct||15)?'var(--amber)':'var(--green)')+'">'+c.margin+'%</b><span>margin เฉลี่ย</span></div></div>' +
      '</button>';
  }).join('') + '</div>';

  if (!cs.length) h += '<div class="card" style="margin-top:12px;text-align:center;color:var(--tx-3)">ไม่พบลูกค้าที่ตรงกับตัวกรอง</div>';
  return h;
}

function openBoard() { VIEW = 'board'; CUST = ''; ALL = true; EDIT = {}; SEL = {}; CONF = {}; Q=''; G='ทั้งหมด'; SORT = 'crisis'; PAGE = 0; load(); }

/* ต่อรองสองทาง (พี่หมิง v15) — ลูกค้าขอลด ≠ ต้องยอมเสียกำไรอย่างเดียว
   อีกทางคือไปขอโรงงานลดทุน · ตัวเลขทุนมาจากฐานจริง ไม่ใช่ค่าประมาณจากเป้า */
function reqAnalysis(r) {
  var a = r.analysis; if (!a) return '';
  var tone = a.belowFloor ? 'var(--red)' : a.marginAt < a.targetLo ? '#8A5A00' : 'var(--green)';
  return '<div style="font-size:11px;margin-top:5px;color:' + tone + '">margin ตอนนี้ <b>' + a.marginNow + '%</b> → ที่ราคาที่ขอ <b>' + a.marginAt + '%</b> · เป้า ' + a.targetLo + '%' +
    (a.costCut > 0 ? ' · จะให้ราคานี้ได้ ทุนต้องไม่เกิน <b>' + a.maxCost + ' ฿</b> (ลด ' + a.costCut + ' ฿)' : ' · ให้ได้โดยไม่หลุดเป้า') + '</div>';
}


/* คำขอลดราคาจากเซลล์ — ต้องขึ้นทั้งหน้ากองใบและหน้าใบ ดีลค้างอยู่ที่พี่จุ๋ม */
function reqCard() {
  var N = NEGO; if (!N || !N.total) return '';
  var stChip = function (i) { var c = i.stage === 'new' ? 'r' : i.stage === 'supplier' ? 'a' : i.stage === 'decided' ? 'g' : 'n'; return '<span class="pill2 ' + c + '">' + esc(i.stageText) + '</span>' + (i.stale ? ' <span class="pill2 r">ค้าง ' + i.age + ' วัน ไม่มีความเคลื่อนไหว</span>' : ''); };

    '<div class="reqs">' + N.items.slice(0, 5).map(function (i) {

      return '<div class="rq"><div class="rqb"><b>' + esc(i.cust) + '</b><span>' + esc(i.product) + '</span>' +
        '<em>เสนอไป <b>' + (i.offered ? Math.round(i.offered) + ' ฿' : '—') + '</b> · ลูกค้าขอ <b>' + Math.round(i.want) + ' ฿</b>' + (i.final_price ? ' · Pricing อนุมัติ <b>' + Math.round(i.final_price) + ' ฿</b>' : '') + ' · ' + esc(String(i.at).slice(0, 16).replace('T', ' ')) + ' · ' + (i.source === 'customer' ? 'ลูกค้ากดในลิงก์' : 'เซลล์ส่งมา') + '</em>' +
        (i.reason ? '<i>“' + esc(i.reason) + '”</i>' : '') + '<div style="margin-top:4px">' + stChip(i) + '</div>' + (rq.status === 'open' ? reqAnalysis(rq) : '') + '</div>' +
        '<div class="rqa">' + (i.stage === 'new' || i.stage === 'supplier'
          ? '<button class="btn pri" onclick="openNegotiation(' + i.id + ')">เปิดแผนต่อรอง</button>' + (i.stage === 'new' ? '<button class="btn" onclick="negoStatus(' + i.id + ',\'supplier\')">กำลังต่อรองโรงงาน</button>' : '') + '<button class="btn" onclick="decide(' + i.id + ',false)">ไม่ลด</button>'

}
function negoStatus(id, st) {

/* ── ส่งใบให้เซลล์ + ตอบคำขอลดราคา ────────────────────────────────
   งานของพี่จุ๋มไม่ได้จบที่ตั้งราคา — จบที่ส่งให้เซลล์ไปปิดกับลูกค้า
   และต้องตอบให้ไวเมื่อเซลล์ขอลดต่ำกว่าเพดาน ไม่งั้นดีลค้าง */
function handoff() {
  var nm = (D.customer && D.customer.name) || 'ใบนี้';
  var rows = rowsInView().filter(function (r) { return V(r).goals; });
  /* ส่งต่อ = ส่ง "ใบที่บันทึกไว้" ไม่ใช่ตัวเลขบนจอ — มีแก้ค้าง/ราคาบนจอไม่ตรงที่บันทึก/ของที่ใช้คิดเปลี่ยน = บันทึกใหม่ก่อน */
  var dirty = rows.filter(function (r) { var sv = V(r).saved;
    return EDIT[r.id] != null || !CONF[r.id] || staleRow(r) || (sv && Math.round(sv.price) !== priceOf(r)); });
  /* บอกให้ตรงเหตุ: ราคากลางยังไม่ยืนยัน ≠ ยังไม่ได้บันทึก ≠ ทุนเปลี่ยน */
  var nb = rows.filter(function (r) { return V(r).baseApproved === false; }).length;
  if (nb) { PX.toast('ยังส่ง Sales ไม่ได้ — ราคากลางยังไม่ยืนยัน ' + nb + ' รายการ · ไปยืนยันใน Step 1 ก่อน แล้วกลับมาบันทึกใบนี้', 'bad'); return; }
  if (dirty.length) {
    var ns = dirty.filter(function (r) { return staleRow(r); }).length;
    PX.toast('ยังส่ง Sales ไม่ได้ — ' + (dirty.length - ns ? (dirty.length - ns) + ' รายการยืนยัน/แก้บนจอแล้วแต่ยังไม่ได้กด 💾 บันทึกใบราคา' : '') +
      (ns ? (dirty.length - ns ? ' · ' : '') + ns + ' รายการทุน/ราคากลางเปลี่ยนหลังบันทึก ต้องยืนยันใหม่' : ''), 'bad');
    var el0 = document.querySelector('[data-row="' + dirty[0].id + '"]'); if (el0) el0.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  var unsaved = rows.filter(function (r) { return !V(r).saved; }).length;
  if (unsaved) { PX.toast('ยังส่ง Sales ไม่ได้ — ยังไม่ได้บันทึกราคา ' + unsaved + ' รายการ (ยืนยันแล้วกดบันทึกใบราคาก่อน)', 'bad'); return; }
  PX.modal({
    title: 'ส่งใบราคาให้ Sales', sub: nm + ' — Sales ตรวจแล้วส่งลิงก์ให้ลูกค้ายืนยันหรือต่อรอง',
    fields: [{ k: 'note', label: 'ฝากบอกเซลล์ (ไม่ใส่ก็ได้)', type: 'area', rows: 2, ph: 'เช่น เจ้านี้ margin บาง อย่ารับต่อรองง่ายๆ' }],
    okText: 'ส่ง Sales', note: 'เซลล์แก้ราคาเองไม่ได้ — ถ้าลูกค้าขอลด จะเด้งกลับมาให้คุณอนุมัติ',
    onOk: function (v, close) {
      return PX.post('/api/handoff', { customer_id: CUST, note: v.note || '' })
        .then(function () {
          close(); PX.toast('ส่ง <b>' + esc(nm) + '</b> ให้เซลล์แล้ว');
          HANDED[CUST] = true; CUST = ''; VIEW = 'customers'; EDIT = {}; SEL = {}; SENT = false;
          return load();
        });
    } });
}

/* คำขอถูกแก้ระหว่างเปิดฟอร์ม — โหลดคิวใหม่ให้เห็นราคาที่ขอล่าสุดก่อนตัดสิน */
function reloadRequests() {
  return PX.get('/api/price-requests').then(function (r) { REQ = r; draw();
    PX.toast('คำขอนี้เพิ่งเปลี่ยน — โหลดใหม่แล้ว ดูราคาที่ขอล่าสุดก่อนตัดสินอีกครั้ง', 'bad'); });
}
function decide(id, ok) {
  PX.modal({ title: ok ? 'อนุมัติราคานี้' : 'ไม่ลดราคา', sub: ok ? '' : 'ลูกค้าจะเห็นว่าราคาเดิมยังใช้อยู่ · เซลล์เห็นเหตุผล',
    fields: [{ k: 'note', label: 'เหตุผล', type: 'area', rows: 2, ph: 'เช่น ตัวนี้ทุนขึ้น ลดไม่ได้จริงๆ' }],
    okText: ok ? 'อนุมัติ' : 'ยืนยันไม่ลด',
    onOk: function (v, close) {
      /* seen_rev = รุ่นของคำขอที่เห็นบนจอ · ลูกค้าแก้คำขอระหว่างนี้ = server ไม่รับ ให้โหลดใหม่ */
      var rq = (REQ.rows || []).filter(function (x) { return x.id === id; })[0] || {};
      return PX.post('/api/price-decide', { id: id, approve: ok, note: v.note || '', seen_rev: rq.rev })
        .then(function () { close(); return PX.get('/api/price-requests'); })
        .then(function (r) { REQ = r; draw(); PX.toast(ok ? 'อนุมัติแล้ว' : 'ตอบว่าไม่ลดแล้ว'); });

/* เปิดใบแรกที่ยังไม่จบ — เรียงตามงานที่เหลือมากสุดก่อน */
function openFirstOpen() {
  var c = (D.customers || []).filter(function (x) { return x.work > 0; })
    .sort(function (a, b) { return b.work - a.work; })[0];
  if (c) pick(c.id);
  else PX.toast('จบครบทุกใบแล้ว 🎉');

/* ── โต๊ะไล่ราคา: สี่โซนตามลำดับที่คนตั้งราคาคิด ─────────────── */
function zone(r) {
  var p = priceOf(r), m = mgOf(r, p), v = V(r), d = r.costJump, mm = v.market || {};
  var dot = '<span style="color:var(--tx-3);font-family:var(--fn)">·</span>';
  var pv = prevOf(r);
  var z1 = pv ? '<b>' + pv + '</b><em>' + (CUST ? 'เจ้านี้ได้รอบก่อน' : 'รอบก่อนออก') + '</em>' : dot + '<em>ยังไม่เคยประกาศ</em>';
  var z2 = d
    ? '<b style="color:' + (d > 0 ? 'var(--red)' : 'var(--green)') + '"><s style="color:var(--tx-3);font-weight:400;font-size:12px">' + r.costPrev + '</s> ' +
      r.cost + '</b><em style="color:' + (d > 0 ? 'var(--red)' : 'var(--green)') + '">' + (d > 0 ? 'ขึ้น ' : 'ลง ') + Math.abs(d) + ' ฿</em>'
    : '<b>' + r.cost + '</b><em>' + (r.costPrev > 0 ? 'ทุนไม่ขยับ' : 'ไม่มีข้อมูลรอบก่อน') + '</em>';
  var z3 = mm.n ? '<b>' + mm.median + '</b><em>median ' + mm.n + ' เจ้า · ' + mm.low + '–' + mm.high + ' ฿</em>'
    : r.cheapest ? '<b style="text-decoration:line-through;color:var(--tx-3)">' + r.cheapest.price + '</b><em style="color:var(--amber)">' + esc(r.cheapest.label) + ' · หมดอายุ</em>'
    : dot + '<em>ยังไม่รู้ตลาด</em>';
  return { z1: z1, z2: z2, z3: z3, p: p, m: m, mk: mm.n ? mm : null };
}

/* ปุ่ม Goal: รวม Goal ที่ได้ราคาเท่ากันเป็นปุ่มเดียว (ป้ายบอกทุกชื่อ) · ปิดปุ่มพร้อมเหตุผลเมื่อไม่มีข้อมูล · ธงส้ม/แดงเมื่อต่ำกว่า Floor (ไม่ปรับเอง) */
var GOAL_ORDER = ['hold', 'competitive', 'target', 'protect'];
function optsOf(r) {
  var g = V(r).goals; if (!g) return [];
  var rec = V(r).rec || {}, out = [], seen = {};
  GOAL_ORDER.forEach(function (k) {
    var gk = g[k] || {};
    if (gk.disabled) { out.push({ keys: [k], label: STRATS[k].name, disabled: true, reason: gk.reason || gk.why || 'ไม่มีข้อมูล', why: gk.why }); return; }
    if (seen[gk.price]) { seen[gk.price].keys.push(k); return; }
    var o = { keys: [k], price: gk.price, margin: gk.margin, why: gk.why, flag: gk.flag || (gk.belowFloor ? 'below_floor' : null), fp: gk.floorPrice, prev: gk.prev };
    seen[gk.price] = o; out.push(o);
  });
  var enabled = out.filter(function (o) { return !o.disabled; });
  out.forEach(function (o) {
    if (o.disabled) return;
    o.isRec = rec.price === o.price && o.keys.indexOf(rec.strategy) >= 0;
    /* ทุก Goal เท่ากันหมด → โชว์แค่ "ยืนราคาเดิม" หรือ "แข่งขันได้" */
    var names = enabled.length === 1 && o.keys.length > 1 ? [o.keys.indexOf('hold') >= 0 ? 'hold' : o.keys.indexOf('competitive') >= 0 ? 'competitive' : o.keys[0]] : o.keys;
    o.label = names.map(function (k) { return k === 'hold' && o.prev ? 'เดิม ' + o.prev : STRATS[k].name; }).join(' = ');
    o.hasHold = o.keys.indexOf('hold') >= 0; o.hasComp = o.keys.indexOf('competitive') >= 0;
  });
  return out;
}

function why(r) {
  var g = goalOf(r), v = V(r), out = [];
  if (!v.goals) return esc(v.readyText || 'ยังไม่รู้ทุน — ตั้งราคาไม่ได้ ต้องกรอกทุนก่อน');
  if (g) out.push(g.why);
  /* บอกเหตุผลที่แถวนี้ "ต้องตรวจ" ให้เห็นในแถวเลย — เดิมมีแค่ป้ายนับรวม ไม่รู้ว่าติดเพราะอะไร */
  var p0 = priceOf(r), pv0 = prevOf(r);
  if (pv0 > 0 && Math.abs(p0 - pv0) >= Math.max(D.jumpBaht || 8, pv0 * 0.05))
    out.push('<b style="color:var(--amber)">ต้องตรวจ: ราคาขยับ ' + (p0 > pv0 ? '+' : '') + Math.round(p0 - pv0) + ' ฿ จากรอบก่อน (' + Math.round(pv0) + ' → ' + Math.round(p0) + ')</b>');
  if (belowGuard(r)) out.push('<b style="color:var(--red)">ต่ำกว่าขั้นต่ำ ' + guardOf(r) + ' ฿' + (EXC[r.id] ? ' · ข้อยกเว้น: ' + esc(EXC[r.id]) : '') + '</b>');
  // V29: HOLD/COMPETITIVE ต่ำกว่า floor — แจ้ง warning ให้ผู้ตั้งราคาตัดสินใจเอง
  var selGoal = rowGoal(r), ggoals = (v.goals || {});
  if (!belowGuard(r) && (selGoal === 'hold' || selGoal === 'competitive') && ggoals[selGoal] && ggoals[selGoal].belowFloor)
    out.push('<b style="color:' + (selGoal==='competitive'?'var(--red)':'var(--amber)') + '">⚠ ' + esc(STRATS[selGoal].name) + ' ต่ำกว่า Floor ' + ggoals[selGoal].floorPrice + ' ฿ — ต้องตัดสินใจเอง</b>');
  if (!CUST && v.central && v.central.state !== 'approved') out.push('<b style="color:' + (v.central.state === 'margin_at_risk' ? 'var(--red)' : 'var(--amber)') + '">' + esc(centralStateText(v)) + '</b>');
  if (!CUST && v.rec && priceOf(r) !== v.rec.price && approvedPrice(r) == null) out.push('ระบบแนะนำ ' + v.rec.price + ' ฿ (' + esc((STRATS[v.rec.strategy] || {}).name || '') + ')');
  if (CUST && v.baseApproved === false) out.push('<b style="color:var(--red)">ราคากลางยังไม่ยืนยัน — จบ Step 1 ก่อน</b>');
  if (CUST && v.baseChanged) out.push('<b style="color:var(--amber)">ราคากลางเปลี่ยนหลังบันทึกใบนี้ (ตอนนี้ ' + v.base + ' ฿) — ตรวจใหม่</b>');
  if (CUST && v.costChanged) out.push('<b style="color:var(--amber)">ทุนของเจ้านี้เปลี่ยนหลังบันทึกใบนี้ — ยืนยันใหม่ก่อนส่งต่อ Sales</b>');
  return out.join(' · ');
}

/* ── แถบตัวเลขของใบนี้ — ตัดสินใจจากสี่ตัวนี้ก่อนจะไล่ทีละแถว ── */
function toggleUnpriced() { UNPRICED = UNPRICED === 'EXCLUDE' ? 'SUGGEST' : 'EXCLUDE'; draw(); }
function sheetKPI(all, rows) {
  var withCost = all.filter(function (r) { return r.cost > 0 && V(r).goals; });
  /* §6: Margin รวม real-time จากราคาที่ตั้งอยู่ตอนนี้ ถ่วงด้วยปริมาณขายรอบก่อน · SKU ที่ยังไม่ตั้งราคา: ไม่นับ (EXCLUDE) หรือใช้ราคาที่ระบบเสนอ (SUGGEST) */
  var exclude = UNPRICED === 'EXCLUDE';
  var priced = withCost.filter(function (r) { return !exclude || approvedPrice(r) != null || CONF[r.id] === true || EDIT[r.id] != null; });
  var knownVol = priced.filter(function (r) { return (r.vol || 0) > 0; });
  var rev = knownVol.reduce(function (a, r) { return a + priceOf(r) * r.vol; }, 0), gp = knownVol.reduce(function (a, r) { return a + (priceOf(r) - r.cost) * r.vol; }, 0);
  var mgs = priced.map(function (r) { return mgOf(r, priceOf(r)); }), fallback = mgs.length ? mgs.reduce(function (a, b) { return a + b; }, 0) / mgs.length : 0;
  var mgTotal = rev > 0 ? gp / rev * 100 : fallback;
  /* รายการเสี่ยง = ราคาที่ตั้ง < Floor หรือ < ทุน · Exception = ไม่มีข้อมูลตลาด · ทุนเปลี่ยนเกิน 15% · ลูกค้าต่อรองกลับมา */
  var risk = withCost.filter(function (r) { return priceOf(r) < guardOf(r) || priceOf(r) <= r.cost; });
  var loss = withCost.filter(function (r) { return priceOf(r) <= r.cost; }).length;
  var negoP = {}; ((NEGO && NEGO.items) || []).forEach(function (i) { if (i.stage === 'new' || i.stage === 'supplier') negoP[i.product_id] = 1; });
  var exNoMkt = withCost.filter(function (r) { return V(r).goals.competitive.disabled; }).length;
  var exCost = withCost.filter(function (r) { return r.costPrev > 0 && Math.abs(r.costJump || 0) / r.costPrev > 0.15; }).length;
  var exNego = withCost.filter(function (r) { return negoP[r.id]; }).length;
  var exc = withCost.filter(function (r) { return V(r).goals.competitive.disabled || (r.costPrev > 0 && Math.abs(r.costJump || 0) / r.costPrev > 0.15) || negoP[r.id]; }).length;
  var work = rows.filter(needsWork).length, done = all.length - all.filter(needsWork).length;
  return '<div class="kpi kpi4">' +
    '<div class="k lead"><div class="kt"><span class="ic">📊</span><span class="pill">นับแล้ว ' + priced.length + ' จาก ' + all.length + ' รายการ</span></div>' +
      '<div class="lb">Margin รวม (real-time)</div>' +
      '<div class="v">' + (priced.length ? mgTotal.toFixed(1) : '—') + (priced.length ? '<small>%</small>' : '') + '</div>' +
      '<div class="c">' + (knownVol.length ? 'ถ่วงน้ำหนักด้วยยอดขายรอบก่อน ' + knownVol.length + ' รายการ' : priced.length ? 'เฉลี่ย ' + priced.length + ' รายการ (ยังไม่รู้ปริมาณ)' : 'ยังไม่มีรายการที่ตั้งราคา') +
        ' · SKU ที่ยังไม่ตั้ง: <button class="lnk3" style="color:#fff;text-decoration:underline" onclick="toggleUnpriced()">' + (exclude ? 'ไม่นับ' : 'ใช้ราคาที่ระบบเสนอ') + ' ⇄</button></div></div>' +
    '<div class="k"><div class="kt"><span class="ic">💰</span><span class="pill ' + (gp > 0 ? 'g' : 'r') + '">ประมาณการ</span></div>' +
      '<div class="lb">กำไรขั้นต้น / สัปดาห์</div>' +
      '<div class="v">' + (knownVol.length ? money(gp) : '—') + '<small>฿</small></div>' +
      '<div class="c">Σ (ราคาที่ตั้ง − ทุน) × ยอดขายรอบก่อน · เปลี่ยนทันทีเมื่อแก้ราคา</div></div>' +
    '<div class="k"><div class="kt"><span class="ic">⚠️</span><span class="pill ' + (risk.length ? 'r' : 'g') + '">ต่ำกว่า Floor</span></div>' +
      '<div class="lb">รายการเสี่ยง</div>' +
      '<div class="v" style="color:' + (risk.length ? 'var(--red)' : 'var(--green)') + '">' + risk.length + '</div>' +
      '<div class="c">ราคาที่ตั้ง &lt; Floor ของกลุ่ม หรือ &lt; ทุน · ขาดทุนตรงๆ ' + loss + ' รายการ</div></div>' +
    '<div class="k"><div class="kt"><span class="ic">🎯</span><span class="pill ' + (exc ? 'a' : 'g') + '">Exception</span></div>' +
      '<div class="lb">ต้องให้คนตัดสิน</div>' +
      '<div class="v">' + exc + '</div>' +
      '<div class="c">ไม่มีข้อมูลตลาด ' + exNoMkt + ' · ทุนเปลี่ยนเกิน 15% ' + exCost + ' · ลูกค้าต่อรอง ' + exNego + (work ? ' · <button class="lnk3" onclick="jumpFirst()">พาไปตัวแรกที่ต้องตรวจ (' + work + ') →</button>' : ' · จบแล้ว ' + done + '/' + all.length) + '</div></div>' +
    '</div>';
}

function pricingInsights(all) {
  var scored = all.filter(function (r) { return r.cost > 0 && (r.vol || 0) > 0; })
    .map(function (r) { return { r:r, gp:(priceOf(r) - r.cost) * r.vol, m:mgOf(r, priceOf(r)) }; })
    .sort(function (a,b) { return b.gp - a.gp; });
  var top = scored.slice(0,5);
  var risk = all.filter(function (r) { return needsWork(r); })
    .sort(function (a,b) {
      var ma=mgOf(a,priceOf(a)), mb=mgOf(b,priceOf(b));
      return ma-mb || (b.costJump||0)-(a.costJump||0);
    }).slice(0,5);
  return '<div class="row c2">' +
    '<div class="card"><h3>Top 5 รายการทำกำไรสูงสุด<span class="sub">รอบ ' + CUR_PERIOD + '</span></h3>' +
      '<p class="hint">จัดอันดับจาก contribution = (ราคาขาย − ต้นทุน) × volume ของรอบนี้</p>' +
      (top.length ? '<div class="profitlist">' + top.map(function (x,i) {
        return '<div class="profitrow"><span class="rank">' + (i+1) + '</span>' +
          '<span class="pn">' + esc(x.r.name) + '</span><span class="pv">+' + money(x.gp) + ' ฿</span>' +
          '<span class="pm">' + x.m.toFixed(1) + '%</span></div>'; }).join('') + '</div>'
        : '<p class="hint">ยังไม่มี volume พอคำนวณ contribution</p>') + '</div>' +
    '<div class="card"><h3>รายการที่ต้องตัดสินใจ<span class="sub">รอบ ' + CUR_PERIOD + ' · Floor = Minimum margin ของกลุ่ม (ตั้งค่าที่หน้า Margin Guard)</span></h3>' +
      '<p class="hint">ทุนขึ้นแรง / Margin ต่ำ / แพงกว่าตลาด จะถูกดันขึ้นมาก่อน</p>' +
      (risk.length ? '<div class="risklist">' + risk.map(function (r) {
        return '<div class="riskitem"><span class="rn">' + esc(r.name) + '</span>' +
          '<span class="rv">' + mgOf(r, priceOf(r)).toFixed(1) + '%</span>' +
          '<button class="lnk3" onclick="openBoard()">เปิดตรวจ</button></div>'; }).join('') + '</div>'
        : '<p class="hint" style="color:var(--green)">✓ ไม่มีรายการที่ต้องตัดสินใจ</p>') + '</div></div>';
}

/* พาสายตาไปแถวแรกที่ยังต้องตัดสิน — ไม่ใช่ให้ไล่หาเองใน 78 แถว */

  if (!el) return;
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  el.classList.add('flash');
  setTimeout(function () { el.classList.remove('flash'); }, 1200);
}

      ? '<button class="st2" onclick="openBoard()"><span class="sn2">1</span><b>ตั้งราคากลาง</b><em>363 SKU · ราคาฐานของรอบนี้</em></button><i class="ar2">→</i>' +
        '<button class="st2 on" onclick="openCustomerList()"><span class="sn2">2</span><b>ตั้งราคารายเจ้า</b><em>กำลังตรวจ ' + esc(name) + '</em></button>'
      : '<div class="st2 on"><span class="sn2">1</span><b>ตั้งราคากลาง</b><em>AI เตรียมราคาให้ทุก SKU · คนตรวจและยืนยันก่อนบันทึก</em></div><i class="ar2">→</i>' +
        '<button class="st2" onclick="openCustomerList()"><span class="sn2">2</span><b>ตั้งราคารายเจ้า</b><em>ใช้ราคากลางเป็นฐาน แล้วตรวจตามเงื่อนไขลูกค้า</em></button>') +
    '</div>';
  /* Ref 2 / customer detail: ไม่มี Dashboard — เข้าสู่ Goal + ตารางทันที */
  h += goalControl();

  var confirmed = confirmedCount(all);
  var stable = all.filter(function(r){
    var pv=prevOf(r); return pv>0 && priceOf(r)===pv && !needsWork(r);
  }).length;

  /* ใบรายเจ้าผูกกับ "รอบที่ประกาศล่าสุด" — ราคากลางชุดใหม่ยืนยันแล้วแต่ยังไม่ประกาศ = กำลังเตรียมรอบหน้า
     บันทึกใบตอนนี้ = แก้ใบรอบที่ลูกค้าถืออยู่ (และถ้าราคาเปลี่ยน ลิงก์ของลูกค้าจะปิดรอส่งใหม่) */
  /* ราคากลางยังไม่ยืนยัน = ใบรายเจ้าบันทึก/ส่งต่อไม่ได้ (V21: ต้องเริ่มจากราคากลางที่ยืนยันแล้ว)
     บอกตั้งแต่เปิดใบ พร้อมปุ่มไป Step 1 — เดิมให้กดยืนยันทีละแถวจนครบแล้วค่อยล้มตอนบันทึก (พีช 30 ก.ย.) */
  var noBase = CUST ? rowsInView().filter(function (r) { return V(r).goals && V(r).baseApproved === false; }) : [];
  if (noBase.length)
    h += '<div class="warn2" style="margin:10px 0;border-color:var(--red);background:var(--red-l)"><b>ราคากลางยังไม่ยืนยัน ' + noBase.length + ' รายการในใบนี้</b> — ' +
      'ใบรายเจ้าต้องเริ่มจากราคากลางที่ยืนยันแล้ว จึงยังบันทึก/ส่ง Sales ไม่ได้ · เช่น ' +
      noBase.slice(0, 3).map(function (r) { return esc(r.name); }).join(', ') +
      ' <button class="btn pri" style="margin-left:8px" onclick="CUST=\'\';openBoard()">ไปยืนยันราคากลาง (Step 1) →</button></div>';
  if (CUST && D.centralAfterRound)
    h += '<div class="warn2" style="margin:10px 0">⚠ ราคากลางชุดใหม่ยืนยันแล้ว <b>' + D.centralAfterRound + '</b> รายการ แต่ยังไม่ได้ประกาศ — ' +
      'ใบที่บันทึกตอนนี้เป็นของรอบ <b>' + esc(D.round || '') + '</b> (ใบที่ลูกค้าถืออยู่) · ถ้าจะทำใบสัปดาห์หน้า ให้ประกาศรอบใหม่ก่อน</div>';

  h += '<div class="savebar">' +

    '<span class="decisionchip">ยืนยันแล้ว ' + confirmed + '/' + all.filter(function (r) { return V(r).goals; }).length +

    '<button class="btn" onclick="confirmNormal()">✓ ยืนยันรายการปกติทั้งหมด</button>' +
    '<input id="q" class="btn" style="min-width:180px;font-weight:400" placeholder="ค้นชื่อสินค้า…" value="' + esc(Q) + '">' +

      [['crisis','วิกฤตก่อน'],['th','ก–ฮ'],['az','A–Z'],['orders','ออเดอร์มาก']].map(function(x){

      }).join('') + '</span>' +

    h += '<div class="tools" style="margin-top:-2px">' +

      gk.map(function (k) {
        return '<button class="tab' + (G === k ? ' on' : '') + '" onclick="G=' +
          jsq(k) + ';PAGE=0;draw()">' +
          esc(k) + ' (' + grps[k] + ')</button>'; }).join('') + '</div>';

  var k1 = rows.filter(function (r) { return prevOf(r) > 0; }).length;
  var k2 = rows.filter(function (r) { return r.costJump; }).length;
  var k3 = rows.filter(mkt).length;
  var cnt = function (k) { return '<i class="cnt">' + k + '/' + rows.length + '</i>'; };

    '<thead><tr>' +
      '<th>สินค้า</th>' +
      '<th class="zh1">ราคาขายรอบก่อน<span class="thperiod">' + PREV_PERIOD + '</span>' + cnt(k1) + '</th>' +

      '<th class="zh3">ราคาตลาดล่าสุด<span class="thperiod">ข้อมูลล่าสุดที่ยังใช้ได้</span>' + cnt(k3) + '</th>' +
      '<th class="zh4">' + (CUST ? 'ราคาที่จะออก' : 'ส่ง 2kg · ราคากลาง') + '<span class="thperiod">' + (CUST ? 'รอบ ' + CUR_PERIOD : 'ร่างครั้งถัดไป') + '</span></th>' +
      (CUST ? '' : '<th class="zh4">ปลีก<span class="thperiod">⌈ทุน×' + (D.markup || 1.6) + '⌉ · แก้ได้</span></th><th class="zh4">ส่ง 5kg · 10kg<span class="thperiod">2kg −3 · −4 · แก้ได้</span></th>') +
      '<th>Goal 4 แบบ · Logic · ยืนยัน</th>' +
    '</tr></thead><tbody>' +
    (rows.length ? pageRows.map(function(r){
      var z=zone(r), w=needsWork(r), o=optsOf(r), approved=!!CONF[r.id];
      var v=V(r), gd=v.guard||0, eff=v.effectivePct||D.floorPct;

/* Goal ที่แถวนี้ใช้อยู่จริง — กดปุ่ม Goal ไหน = Goal นั้น · พิมพ์เอง = manual · ยืนยันไว้แล้ว = Goal ที่บันทึก · ยังไม่แตะ = Goal ที่เลือกด้านบน */
function rowGoal(r) {
  if (SEL[r.id]) return SEL[r.id];
  if (EDIT[r.id] != null) return 'manual';
  if (approvedPrice(r) != null) { var g = CUST ? (V(r).saved || {}).goal : (V(r).central || {}).goal; return g || ''; }
  return STRATEGY;
}
/* ป้าย "ยืนราคาเดิม" บอกที่มาของตัวเลข — V29: ยืนตรงๆ ไม่ยกขึ้น floor */
function optLabel(r, x) {
  if (x[3] !== 'hold') return x[1];
  var h = (V(r).goals || {}).hold || {};
  if (h.disabled) return 'ไม่มีราคาเดิม';
  if (h.basis === 'prev_low') return 'เดิม ' + h.prev + ' ฿ (ต่ำกว่า floor)';
  return x[1];  // 'prev' = ยืนราคาปกติ

function apply(id, price, goal) {
  var r = D.rows.filter(function (x) { return x.id === id; })[0];

      html: '<div class="sc"><table class="g"><tbody>' +
        row('สินค้าในระบบ (product_id เดียวทุกหน้า)', a.master) +
        row('ยังไม่รู้ทุน', a.noCost, a.noCost > 0) +
        row('ราคากลางยืนยันแล้ว / ทุนเปลี่ยนต้องยืนยันใหม่ / ยังไม่เคยยืนยัน', c.approved + ' / ' + c.stale + ' / ' + c.missing, (c.stale + c.missing) > 0) +
        row('รู้ราคาตลาดที่ยังใช้ได้', a.market.live + ' / ' + a.master, a.market.live < a.master / 3) +
        row('ชื่อสินค้าซ้ำกัน (อาจเป็นตัวเดียวกัน)', a.nameCollisions + ' กลุ่ม', a.nameCollisions > 0) +
        row('บรรทัดสัญญาที่ชี้สินค้าที่ไม่มีแล้ว', a.orphanLines, a.orphanLines > 0) +
        row('รอบนี้: ยืนยันราคารายเจ้า / ส่ง Sales / ส่งลูกค้า', a.round.customersPriced + ' / ' + a.round.handed + ' / ' + a.round.sent + ' เจ้า') +
        row('หมวด', Object.keys(a.categories).map(function (k) { return k + ' ' + a.categories[k]; }).join(' · ')) +
        '</tbody></table></div>' +
        (a.collisions && a.collisions.length ? '<p class="hint" style="margin-top:8px">ชื่อซ้ำ: ' + a.collisions.slice(0, 5).map(function (g) {
          return g.map(function (x) { return esc(x.name) + ' (' + esc(x.grp || '') + ')'; }).join(' = '); }).join(' · ') + '</p>' : '') });
  }).catch(function (e) { PX.toast('ตรวจไม่ได้ — ' + esc(e.message), 'bad'); });
}
Dash.mount('pricing');   /* หน้าสรุปตามบทบาท (dash.js) — วางบนหน้าแรก วาดซ้ำเมื่อหน้าแม่วาดใหม่ */
</script>
