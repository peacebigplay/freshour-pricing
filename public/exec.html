<!doctype html><html lang="th"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Decision Cockpit · Freshour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/peach.css">
<style>
/* Executive Decision Cockpit — อ่านบนลงล่าง: AI ทำงานดีแค่ไหน → pipeline ติดตรงไหน → ขายได้จริงเท่าไร → margin รายกลุ่ม → ลูกค้า/เซลล์ที่ต้องจับตา → ต้องตัดสินใจอะไร */
.xc-strip{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:12px 16px;margin-bottom:14px;box-shadow:var(--sh-c)}
.xc-strip .q{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:12px;background:var(--app);font-size:12.5px}.xc-strip .q b{font-family:var(--fn);font-size:18px}
.xc-strip .q.bad{background:var(--red-l)}.xc-strip .q.ok{background:var(--green-l)}.xc-strip .q.warn{background:var(--amber-l)}
.xc-sec{margin:22px 0 10px;display:flex;align-items:baseline;gap:10px}.xc-sec h2{font-size:15px;margin:0;font-weight:600}.xc-sec .n{font-family:var(--fn);font-size:11px;color:#fff;background:var(--blue);border-radius:99px;padding:1px 8px}.xc-sec .sub{font-size:12px;color:var(--tx-3)}
.xc-basis{font-size:11px;color:var(--tx-3);margin-top:8px;line-height:1.5}
.xc-funnel{display:grid;gap:8px}.xc-funnel .st{display:grid;grid-template-columns:200px 1fr 150px;gap:12px;align-items:center;font-size:12.5px}.xc-funnel .bar{height:22px;background:var(--line-2);border-radius:6px;overflow:hidden;position:relative}.xc-funnel .bar i{display:block;height:100%;background:var(--blue);border-radius:6px}.xc-funnel .bar.soft i{background:var(--blue-b)}.xc-funnel .bar b{position:absolute;left:8px;top:2px;font-family:var(--fn);font-size:12px;color:#fff;mix-blend-mode:difference}.xc-funnel .drop{color:var(--tx-3);font-size:11.5px}.xc-funnel .drop.bad{color:var(--red)}
@media(max-width:760px){.xc-funnel .st{grid-template-columns:1fr;gap:4px}}
.xc-bn{display:grid;gap:10px}.xc-bn .b{display:grid;grid-template-columns:44px 1.3fr 1fr 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card)}.xc-bn .rk{font-family:var(--fn);font-size:22px;font-weight:600;color:var(--blue)}.xc-bn b{display:block}.xc-bn small{display:block;color:var(--tx-3);font-size:11px}.xc-bn .v{font-family:var(--fn);font-size:16px}
@media(max-width:900px){.xc-bn .b{grid-template-columns:36px 1fr}.xc-bn .b>div:nth-child(n+3){grid-column:2}}
.xc-dec{display:grid;gap:10px}.xc-dec .d{border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:14px;padding:12px 14px;background:var(--card)}.xc-dec .d.policy{border-left-color:var(--blue)}.xc-dec .d.commercial{border-left-color:var(--red)}.xc-dec .d.process{border-left-color:var(--green)}.xc-dec .d.market{border-left-color:var(--amber)}
.xc-dec .t{font-weight:600}.xc-dec .w{font-size:12px;color:var(--tx-2);margin:3px 0 6px}.xc-dec .o{display:flex;gap:6px;flex-wrap:wrap}.xc-dec .o span{font-size:11.5px;padding:3px 9px;border-radius:99px;background:var(--app);border:1px solid var(--line)}
table.xc{width:100%;border-collapse:collapse;font-size:12.5px}table.xc th{text-align:left;font-size:11px;color:var(--tx-3);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line)}table.xc td{padding:7px 8px;border-bottom:1px dashed var(--line)}table.xc td.n,table.xc th.n{text-align:right;font-family:var(--fn)}
.xc-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:860px){.xc-2{grid-template-columns:1fr}}
.xc-empty{color:var(--tx-3);font-size:12.5px;padding:10px 0}
.xc-rs{display:grid;gap:5px;margin-top:8px}.xc-rs div{display:grid;grid-template-columns:1fr 60px;gap:8px;align-items:center;font-size:11.5px}.xc-rs i{display:block;height:8px;background:var(--amber);border-radius:4px}.xc-rs b{font-family:var(--fn);text-align:right;font-weight:500}
details.xc-src{margin-top:18px;font-size:12px;color:var(--tx-2)}details.xc-src summary{cursor:pointer;color:var(--tx-3)}
</style>
</head><body>
<script src="/peach.js"></script>
<script src="/charts.js"></script>
<script>
var esc = PX.esc, money = PX.money, E = null;
PX.shell('exec', '<div class="float"><div class="ic">🧭</div><b>Decision Cockpit</b><span id="floatSub">กำลังอ่าน…</span><button onclick="load()">โหลดใหม่</button></div>');
function baht(n) { return n == null ? '—' : n >= 1e6 ? '฿' + (n / 1e6).toFixed(2) + 'M' : n >= 1e3 ? '฿' + (n / 1e3).toFixed(0) + 'K' : '฿' + money(Math.round(n)); }
function pct(v) { return v == null ? '—' : v + '%'; }
function k(ic, pill, pillCls, lb, v, c, lead) { return '<div class="k' + (lead ? ' lead' : '') + '"><div class="kt"><span class="ic">' + ic + '</span>' + (pill ? '<span class="pill ' + (pillCls || '') + '">' + pill + '</span>' : '') + '</div><div class="lb">' + lb + '</div><div class="v">' + v + '</div><div class="c">' + c + '</div></div>'; }
function sec(n, t, sub) { return '<div class="xc-sec"><span class="n">' + n + '</span><h2>' + t + '</h2>' + (sub ? '<span class="sub">' + sub + '</span>' : '') + '</div>'; }
function vtxt(o) { return o && o.known ? baht(o.value) + (o.unknown ? ' <small style="color:var(--tx-3)">(+' + o.unknown + ' เจ้าไม่รู้มูลค่า)</small>' : '') : '<span style="color:var(--tx-3)">ยังไม่รู้มูลค่า</span>'; }

function draw() {
  var main = document.getElementById('main'), A = E.ai, F = E.flow, Bn = E.bottlenecks, C = E.commercial, Act = E.actual, Au = E.automation, Dc = E.decisions;
  var h = PX.head('Decision Cockpit · รอบ ' + esc(E.round || ''), 'AI ทำงานดีแค่ไหน → pipeline ติดตรงไหน → ขายได้จริงเท่าไร → margin รายกลุ่ม → ใครต้องจับตา → ต้องตัดสินใจอะไร · ถ้าทุกอย่างปกติ หน้านี้ควรอ่านจบใน 2 นาที', ['หมิง', 'พี่หมิง', 'ผู้บริหาร']);
  /* ── แถบคำตอบ 4 ข้อ ── */
  h += '<div class="xc-strip">' +
    '<div class="q ' + (A.coverage.pct >= 80 ? 'ok' : A.coverage.pct >= 60 ? 'warn' : 'bad') + '">🤖 AI ทำเองได้ <b>' + pct(A.coverage.pct) + '</b></div>' +
    '<div class="q ' + (Act.none ? '' : 'ok') + '">💰 ขายจริง YTD <b>' + (Act.none ? '—' : baht(Act.revenue)) + '</b>' + (Act.none ? '<small style="color:var(--tx-3)">ยังไม่มี invoice</small>' : '') + '</div>' +
    '<div class="q ' + (Au.ok && !Bn.length ? 'ok' : Bn.length ? 'warn' : 'bad') + '">⚠️ ผิดปกติ/คอขวด <b>' + Bn.length + '</b>' + (Au.ok ? '<small>automation ปกติ</small>' : '<small style="color:var(--red)">automation มีปัญหา ' + Au.issues.length + '</small>') + '</div>' +
    '<a class="q ' + (Dc.length ? 'warn' : 'ok') + '" href="#decide" style="text-decoration:none;color:inherit">🧭 ต้องตัดสินใจ <b>' + Dc.length + '</b> เรื่อง →</a></div>';

  /* ── 1 AI Pricing Performance ── */
  h += sec(1, 'AI Pricing Performance', 'automation ช่วยได้จริงแค่ไหน');
  var rs = A.review.reasons, rt = A.review.reasonText, rmax = Math.max.apply(null, Object.keys(rs).map(function (x) { return rs[x]; }).concat([1]));
  var rbars = Object.keys(rs).filter(function (x) { return rs[x] > 0; }).sort(function (a, b) { return rs[b] - rs[a]; }).map(function (x) { return '<div><span>' + esc(rt[x]) + '<i style="width:' + Math.round(rs[x] / rmax * 100) + '%"></i></span><b>' + rs[x] + ' SKU</b></div>'; }).join('');
  h += '<div class="kpi">' +
    k('🤖', 'Coverage', A.coverage.pct >= 80 ? 'g' : 'a', 'Automation Coverage', A.coverage.auto + '<small>/ ' + A.coverage.total + ' SKU · ' + pct(A.coverage.pct) + '</small>', 'รับทุน → ตรวจทุน → แนะนำราคาได้เองโดยไม่ติดด่าน', true) +
    k('🙋', 'Human Review', A.review.n ? 'a' : 'g', 'ต้องโยนให้คน', A.review.n + '<small> SKU</small>', A.review.n ? '<div class="xc-rs">' + rbars + '</div>' : 'ไม่มี — AI มั่นใจทุกตัว') +
    k('✅', 'Acceptance', A.acceptance.pct == null ? '' : A.acceptance.pct >= 70 ? 'g' : A.acceptance.pct >= 40 ? 'a' : 'r', 'คนยอมรับราคา AI ตรง ๆ', A.acceptance.decided ? pct(A.acceptance.pct) + '<small>' + A.acceptance.accepted + '/' + A.acceptance.decided + '</small>' : '—<small>ยังไม่มีคนยืนยันรอบนี้</small>',
      (A.acceptance.overrides ? 'Override ' + A.acceptance.overrides + ' ครั้ง · แก้ขึ้น ' + A.acceptance.up + ' / ลง ' + A.acceptance.down + ' · เฉลี่ย ' + (A.acceptance.avgDelta > 0 ? '+' : '') + A.acceptance.avgDelta + ' ฿<br><b>' + esc(A.acceptance.direction) + '</b>' : 'ยืนยันโดยระบบ (auto) ' + A.acceptance.autoApproved + ' SKU ไม่นับ · ต่ำกว่า 40% = ลอจิก AI ยังไม่ตรงวิธีทำงานจริง')) +
    k('📡', 'Market', A.market.confidentPct >= 60 ? 'g' : A.market.confidentPct > 0 ? 'a' : 'r', 'Market Coverage / Confidence', (A.market.fresh + A.market.usable) + '<small>/ ' + A.market.total + ' SKU มีตลาดที่ใช้ได้</small>', 'สด ' + A.market.fresh + ' · ใช้ได้ ' + A.market.usable + ' · เก่า ' + A.market.stale + ' · ไม่มี ' + A.market.blind + (A.market.note ? '<br><b style="color:var(--amber)">' + esc(A.market.note) + '</b>' : '')) + '</div>';
  h += '<p class="xc-basis">ที่มา: ' + esc(A.coverage.basis) + ' · ' + esc(A.acceptance.basis) + '</p>';

  /* ── 2 Flow ── */
  h += sec(2, 'Pricing Flow Health', 'ตกจากขั้นไหนไปขั้นไหน — ไม่ใช่แค่จำนวน');
  h += '<div class="card"><div class="xc-funnel">' + F.steps.map(function (s) { var p = s.total ? Math.round(s.n / s.total * 100) : 0; return '<div class="st"><div><b>' + esc(s.label) + '</b><small style="display:block;color:var(--tx-3)">' + s.n + ' / ' + s.total + ' ' + (s.unit || 'SKU') + '</small></div><a class="bar' + (s.soft ? ' soft' : '') + '" href="' + esc(s.href) + '" title="' + esc(s.why) + '"><i style="width:' + p + '%"></i><b>' + p + '%</b></a><div class="drop' + (s.drop && !s.soft ? ' bad' : '') + '">' + (s.drop ? '↓ ' + esc(s.why) : '✓ ครบ') + '</div></div>'; }).join('') + '</div>' +
    '<p class="xc-basis">"ตลาดพร้อม" ไม่บล็อกการตั้งราคา (ระบบคิดจากทุน+เป้าได้) แต่บอกว่าราคาแนะนำมี data ตลาดรองรับหรือไม่ · กดแท่งเพื่อไปดู root cause</p></div>';

  /* ── 3 Bottlenecks ── */
  h += sec(3, 'What is blocking business?', 'วันนี้ถ้าจะแก้ 1 เรื่อง ควรแก้อะไร');
  h += Bn.length ? '<div class="xc-bn">' + Bn.map(function (b) { return '<div class="b"><div class="rk">#' + b.rank + '</div><div><b>' + esc(b.title) + '</b><small>' + b.n + ' ' + esc(b.unit) + '</small></div><div><span class="v">' + (b.impact.customers || 0) + '</span><small>' + esc(b.impact.text) + '</small></div><div>' + (b.opportunity ? '<span class="v">' + (b.opportunity.known ? baht(b.opportunity.value) : '—') + '</span><small>opportunity' + (b.opportunity.unknown ? ' · ไม่รู้มูลค่า ' + b.opportunity.unknown + ' เจ้า' : '') + '</small>' : '<small>—</small>') + '</div><div><a class="btn pri" href="' + esc(b.action.href) + '" style="font-size:12px;padding:6px 12px">' + esc(b.action.label) + ' →</a></div></div>'; }).join('') + '</div>'
    : '<div class="card"><p class="xc-empty">ไม่มีคอขวด — pipeline ไหล</p></div>';

  /* ── 4 Commercial ── */
  h += sec(4, 'Commercial Performance', 'ตัวเลขจากใบราคา/ดีล ยังไม่ใช่ยอดขายจริง');
  h += '<div class="kpi">' + k('📦', '', '', 'Portfolio Value (รอบนี้)', vtxt(C.portfolio), C.customers + ' ลูกค้าในรอบ', true) + k('📨', '', '', 'Quoted Value', vtxt(C.quoted), 'ส่งราคาออกไปแล้ว ' + (C.quoted.known + C.quoted.unknown) + ' เจ้า') +
    k('🏆', C.winRate == null ? '' : 'Win rate', C.winRate >= 60 ? 'g' : 'a', 'Won / Lost', C.won.n + ' <small>/ ' + C.lost.n + '</small>', 'Won ' + baht(C.won.value) + ' · Lost ' + baht(C.lost.value)) +
    k('🎯', '', '', 'Win Rate · ราย / มูลค่า', pct(C.winRate) + ' <small>· ' + pct(C.valueWinRate) + '</small>', 'Customer win rate · Value win rate (ลูกค้าขนาดไม่เท่ากัน) · ตอบกลับ ' + pct(C.responsePct)) + '</div>';
  h += '<p class="xc-basis">ที่มา: ' + esc(C.basis) + '</p>';

  /* ── 5 Actual ── */
  h += sec(5, 'Actual Financial Result', 'จาก Invoice จริงเท่านั้น');
  h += '<div class="kpi">' + k('💰', Act.none ? 'ยังไม่มี' : Act.year, Act.none ? 'a' : 'g', 'Actual Revenue YTD', Act.none ? '—' : baht(Act.revenue), Act.invoices + ' invoice', true) + k('⚖️', '', '', 'Actual Volume', Act.none ? '—' : money(Math.round(Act.kg)) + '<small> kg</small>', 'กก. ที่ออกบิลแล้ว') + k('📈', '', '', 'Actual GP', Act.none ? '—' : baht(Act.gp), 'ราคาขายจริง − ทุน ณ วันออกบิล') + k('%', Act.margin == null ? '' : 'Margin', Act.margin >= 15 ? 'g' : 'a', 'Actual Margin', pct(Act.margin), 'ไม่ใช้ทุนวันนี้ย้อนหลังไปคิดบิลเก่า') + '</div>';
  if (Act.months && Act.months.length > 1) h += '<div class="card" style="margin-top:12px"><h3>รายเดือน <span class="sub">รายได้ · GP</span></h3>' + Charts.line({ w: 700, h: 150, labels: Act.months.map(function (m) { return m.m.slice(5); }), series: [{ name: 'รายได้', values: Act.months.map(function (m) { return Math.round(m.revenue); }) }, { name: 'GP', values: Act.months.map(function (m) { return Math.round(m.gp); }) }], unit: '฿' }) + '</div>';
  h += '<p class="xc-basis">ที่มา: ' + esc(Act.basis) + (Act.none ? ' · <b>ยังไม่มี invoice ในระบบ</b> — แอดมินออก Invoice จากดีลที่ปิดแล้วที่หน้า <a href="/docs">เอกสารขาย</a> ตัวเลขจะขึ้นที่นี่เอง' : '') + '</p>';
  if (E.ytdSku.length) h += '<div class="card" style="margin-top:12px"><h3>YTD SKU Performance <span class="sub">15 อันดับแรกตามรายได้</span></h3><div class="sc"><table class="xc"><thead><tr><th>สินค้า</th><th>กลุ่ม</th><th class="n">รายได้</th><th class="n">kg</th><th class="n">GP</th><th class="n">Margin</th></tr></thead><tbody>' + E.ytdSku.map(function (x) { return '<tr><td>' + esc(x.name) + '</td><td>' + esc(x.grp) + '</td><td class="n">' + money(x.revenue) + '</td><td class="n">' + money(x.kg) + '</td><td class="n">' + money(x.gp) + '</td><td class="n">' + pct(x.margin) + '</td></tr>'; }).join('') + '</tbody></table></div></div>';

  /* ── 6 Margin by group ── */
  h += sec(6, 'Margin Performance by Product Group', 'Target ต่างกันแต่ละกลุ่ม — ต่ำเพราะ Pricing หรือตลาดบังคับ');
  var MG = E.marginByGroup, ST = { risk: 'r', below: 'a', near: 'a', healthy: 'g', unknown: 'n' };
  h += '<div class="card"><table class="xc"><thead><tr><th>กลุ่ม</th><th class="n">Target</th><th class="n">Min</th><th class="n">Actual</th><th>สถานะ</th><th>ที่มา</th></tr></thead><tbody>' + MG.map(function (g) { return '<tr><td><b>' + esc(g.grp) + '</b></td><td class="n">' + g.target + '%</td><td class="n">' + g.min + '%</td><td class="n"><b>' + pct(g.actual) + '</b></td><td><span class="pill2 ' + ST[g.state] + '">' + esc(g.stateText) + '</span></td><td style="font-size:11px;color:var(--tx-3)">' + (g.basis === 'invoice' ? 'invoice จริง' : 'ราคาสัญญาปัจจุบัน ' + g.lines + ' บรรทัด (เฉลี่ยไม่ถ่วงปริมาณ)') + '</td></tr>'; }).join('') + '</tbody></table>' +
    '<p class="xc-basis">เมื่อมี invoice กลุ่มนั้นจะสลับไปใช้ margin จริงจากบิลอัตโนมัติ · แก้ Target/Min ที่ <a href="/guard">ตั้งค่า Margin Guard</a></p></div>';

  /* ── 7 Customers ── */
  h += sec(7, 'Customer Performance', 'เฉพาะ exception — ไม่ต้องอ่าน timeline ทุกเจ้า');
  var L = E.customers.largest, R = E.customers.atRisk;
  h += '<div class="xc-2"><div class="card"><h3>Largest Opportunities</h3>' + (L.length ? '<table class="xc"><tbody>' + L.map(function (x) { return '<tr><td><b>' + esc(x.name) + '</b><br><small style="color:var(--tx-3)">' + esc(x.owner || '') + '</small></td><td class="n">' + (x.value != null ? baht(x.value) + '/เดือน' : x.lines + ' รายการ') + '</td><td><span class="pill2 b">' + esc(x.stateText) + '</span></td></tr>'; }).join('') + '</tbody></table>' + (L[0] && L[0].value == null ? '<p class="xc-basis">ยังไม่ได้นำเข้ามูลค่าลูกค้า — เรียงตามจำนวนรายการในสัญญาแทน</p>' : '') : '<p class="xc-empty">—</p>') + '</div>' +
    '<div class="card"><h3>At Risk</h3>' + (R.length ? '<table class="xc"><tbody>' + R.map(function (x) { return '<tr><td><b>' + esc(x.name) + '</b><br><small style="color:var(--tx-3)">' + esc(x.why) + '</small></td><td class="n">' + (x.value != null ? baht(x.value) : '—') + '</td><td><span class="pill2 ' + (x.kind === 'lost' ? 'n' : x.kind === 'below_min' ? 'r' : 'a') + '">' + (x.kind === 'silent' ? 'เงียบ' : x.kind === 'below_min' ? 'ต่ำกว่า Min' : 'Lost') + '</span></td></tr>'; }).join('') + '</tbody></table>' : '<p class="xc-empty">ไม่มีลูกค้าเสี่ยงตอนนี้</p>') + '</div></div>';

  /* ── 8 Sales ── */
  h += sec(8, 'Sales Performance', 'ขนาดพอร์ต + ความสามารถในการปิด ไม่ใช่แค่จำนวนที่ปิดได้');
  h += '<div class="card"><table class="xc"><thead><tr><th>Sales</th><th class="n">ลูกค้า</th><th class="n">Portfolio</th><th class="n">Won Value</th><th class="n">Win Rate</th><th class="n">Value Win Rate</th><th class="n">Follow-up SLA</th><th class="n">เปิดอยู่</th></tr></thead><tbody>' + E.sales.map(function (s) { return '<tr><td><b>' + esc(s.name) + '</b></td><td class="n">' + s.customers + '</td><td class="n">' + (s.portfolioKnown ? baht(s.portfolio) : '—') + '</td><td class="n">' + (s.won ? baht(s.wonValue) : '—') + '</td><td class="n">' + pct(s.winRate) + '</td><td class="n">' + pct(s.valueWinRate) + '</td><td class="n">' + pct(s.slaPct) + '</td><td class="n">' + s.open + '</td></tr>'; }).join('') + '</tbody></table><p class="xc-basis">— = ยังไม่มีเหตุการณ์ให้วัด (ยังไม่มี deal ปิด / ยังไม่ครบ SLA) · Portfolio ต้องนำเข้ามูลค่าลูกค้าต่อเดือนก่อน</p></div>';

  /* ── 9 Intelligence ── */
  var I = E.intel;
