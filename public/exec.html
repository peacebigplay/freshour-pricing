<!doctype html><html lang="th"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>รายงานและตัดสินใจราคา · Freshour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/peach.css">
</head><body>
<script src="/peach.js"></script>
<script src="/charts.js"></script>
<script src="/dash.js"></script>
<style>
/* ── Priority 04: Delivery + Issues 2-col grid ───────────── */
.ex-ops-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media(max-width:700px){.ex-ops-grid{grid-template-columns:1fr}}
/* ── Revenue bar chart (Priority 02) ─────────────────────── */
.ex-rev-barchart{background:var(--bg-2);border-radius:10px;padding:10px 12px 6px;margin-top:12px}
.ex-rev-wrap{display:flex;align-items:flex-end;gap:5px;height:80px}
.ex-rev-col{display:flex;flex-direction:column;align-items:center;flex:1;gap:2px;min-width:0}
.ex-rev-bar{width:100%;background:var(--blue);border-radius:4px 4px 0 0}
.ex-rev-col span{font-size:9.5px;color:var(--tx-3);white-space:nowrap;overflow:hidden;text-overflow:clip;max-width:100%}
.ex-rev-col em{font-size:9px;color:var(--tx-2);font-style:normal;white-space:nowrap;display:none}
.ex-rev-col:hover em{display:block}
.ex-rev-note{display:block;font-size:11px;color:var(--tx-3);margin-top:6px;text-align:center}
/* ── Customer Issues summary panel ───────────────────────── */
.is-kpi-row{display:flex;gap:8px;margin:8px 0 10px}
.is-kpi{flex:1;background:var(--bg-2);border-radius:8px;padding:8px 10px;text-align:center}
.is-kpi b{display:block;font-size:20px;font-weight:700;line-height:1.1}
.is-kpi span{font-size:11px;color:var(--tx-2)}
.is-kpi.warn b{color:var(--amber)}
.is-trend-wrap{display:flex;align-items:flex-end;gap:3px;height:42px;margin:8px 0 2px}
.is-tr-col{display:flex;flex-direction:column;align-items:center;flex:1;gap:1px}
.is-tr-bar{width:100%;background:var(--red);border-radius:3px 3px 0 0}
.is-tr-col span{font-size:9.5px;color:var(--tx-3);white-space:nowrap}
.is-type-list{display:flex;flex-direction:column;gap:4px;margin:6px 0 10px}
.is-type{display:flex;justify-content:space-between;font-size:12px;padding:4px 8px;background:var(--bg-2);border-radius:6px}
.is-type b{font-weight:700;color:var(--amber)}
/* ── Market Benchmark v2 (ref image layout) ──────────────── */
.ex-mkt2-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.ex-mkt2-row:last-child{border-bottom:none}
.ex-mkt2-info{min-width:150px;max-width:190px;flex-shrink:0}
.ex-mkt2-name{font-weight:700;font-size:13px;line-height:1.3}
.ex-mkt2-meta{font-size:11px;color:var(--tx-2);margin-top:2px}
.ex-mkt2-track-wrap{flex:1;min-width:0}
.ex-mkt2-track{position:relative;height:10px;background:var(--bg-2);border-radius:5px;margin-bottom:4px}
.ex-mkt2-band{position:absolute;top:0;height:100%;background:var(--blue-l,#DBEAFE);border-radius:5px}
.ex-mkt2-dot{position:absolute;top:50%;transform:translate(-50%,-50%);width:12px;height:12px;background:#1E293B;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.ex-mkt2-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--tx-2)}
.ex-mkt2-labels span:nth-child(2){font-weight:700;color:var(--tx)}
.ex-mkt2-src{min-width:70px;max-width:95px;text-align:right;font-size:11px;color:var(--blue);flex-shrink:0;word-break:break-word}
@media(max-width:600px){.ex-mkt2-src{display:none}.ex-mkt2-info{min-width:90px;max-width:120px}}
/* ══ V30 · พีช 12 ต.ค. — แท็บขีดเส้นใต้ · การ์ดสีบอกดี/แย่ · ตัวเลขใหญ่ชัด ══
   ใช้ .exec-v8.exec-v13 (สองคลาส) ให้ชนะ style ที่ draw() ฉีดทีหลัง */
.exec-v8.exec-v13 .ex-tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);background:var(--card);padding:0;margin:4px 0 2px;overflow-x:auto;position:sticky;top:0;z-index:5;grid-template-columns:none}
.exec-v8.exec-v13 .ex-tabs button{flex:0 0 auto;border:0;border-radius:0;background:none;box-shadow:none;padding:12px 20px 10px;border-bottom:3px solid transparent;margin-bottom:-1px;text-align:center}
.exec-v8.exec-v13 .ex-tabs button b{font-size:14.5px;font-weight:600;color:var(--tx-3)}
.exec-v8.exec-v13 .ex-tabs button span{display:none}
.exec-v8.exec-v13 .ex-tabs button:hover b{color:var(--ink)}
.exec-v8.exec-v13 .ex-tabs button.on{background:none;box-shadow:none;border-bottom-color:var(--blue)}
.exec-v8.exec-v13 .ex-tabs button.on b{color:var(--blue)}
.exec-v8.exec-v13 .ex-hierarchy span{color:var(--blue)}
.exec-v8.exec-v13 .ex-period{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.exec-v8.exec-v13 .ex-period .ex-stale{background:var(--red-l);color:var(--red);font-weight:700;border-radius:99px;padding:3px 10px;font-size:11px}

/* Pricing AI — การ์ด KPI สีเต็มแบบเรฟ + เส้นเล็ก */
@media(min-width:901px){.exec-v8.exec-v13 .ex-perf-grid{grid-template-columns:minmax(250px,320px) minmax(0,1fr);gap:16px}}
.ex-ktile{border-radius:16px;padding:14px 16px;color:#fff;display:grid;grid-template-columns:minmax(0,1fr) 92px;align-items:center;gap:8px;position:relative;overflow:hidden}
.ex-ktile+.ex-ktile{margin-top:10px}
.ex-ktile.c1{background:linear-gradient(135deg,#0052F3,#0041C2)}
.ex-ktile.c2{background:linear-gradient(135deg,#4F46E5,#4338CA)}
.ex-ktile.c3{background:linear-gradient(135deg,#7C3AED,#6D28D9)}
.ex-ktile span{display:block;font-size:11px;opacity:.85}
.ex-ktile b{display:block;font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin:3px 0 2px;font-variant-numeric:tabular-nums}
.ex-ktile b small{font-size:13px;font-weight:600;margin-left:3px;opacity:.85}
.ex-ktile em{font-style:normal;font-size:10.5px;opacity:.9}
.ex-ktile em i{font-style:normal;background:rgba(255,255,255,.2);border-radius:99px;padding:1px 7px;margin-right:4px;font-weight:700}
.ex-ktile svg{width:92px;height:40px;display:block;overflow:visible}

/* การ์ดสรุปราคา: เขียว = ดี · แดง = แย่/ด่วน · ส้ม = ต้องเติม */
.exec-v8.exec-v13 .ex-sum-card{position:relative;overflow:hidden}
.exec-v8.exec-v13 .ex-sum-card b{font-size:28px;letter-spacing:-.02em;color:var(--ink)}
.exec-v8.exec-v13 .ex-sum-card.good{background:var(--green-l);border-color:var(--green-b)}
.exec-v8.exec-v13 .ex-sum-card.good b{color:#15803D}
.exec-v8.exec-v13 .ex-sum-card.bad{background:var(--red-l);border-color:var(--red-b)}
.exec-v8.exec-v13 .ex-sum-card.bad b{color:#B91C1C}
.exec-v8.exec-v13 .ex-sum-card.warn{background:var(--orange-l);border-color:var(--orange-b)}
.exec-v8.exec-v13 .ex-sum-card.warn b{color:#C2410C}
.ex-chip{display:inline-block;font-style:normal;font-size:10.5px;font-weight:700;border-radius:99px;padding:2px 8px;margin-right:5px}
.ex-chip.up{background:#fff;color:var(--red);border:1px solid var(--red-b)}
.ex-chip.down{background:#fff;color:var(--green);border:1px solid var(--green-b)}

/* ตำแหน่งราคาในตลาด (Market Benchmark) แบบเรฟ */
.ex-mb-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ex-mb-head h3{margin:0}
.ex-mb-head .ex-mb-all{margin-left:auto;font-size:12px;font-weight:700;color:var(--blue);background:none;border:0;cursor:pointer;font-family:var(--ff)}
.ex-mb-row{display:grid;grid-template-columns:minmax(120px,170px) minmax(0,1fr) 92px;gap:14px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.ex-mb-row:last-child{border-bottom:0}
.ex-mb-name{font-weight:700;font-size:13px;line-height:1.3}
.ex-mb-name .tag-ex{font-size:9.5px;font-weight:600;color:var(--amber);background:var(--amber-l);border-radius:99px;padding:1px 6px;margin-left:5px;vertical-align:middle}
.ex-mb-meta{font-size:10.5px;color:var(--tx-3);margin-top:2px}
.ex-mb-track{position:relative;height:8px;background:var(--line-2);border-radius:99px;margin:14px 0 6px}
.ex-mb-band{position:absolute;top:0;height:100%;background:#BFDBFE;border-radius:99px}
.ex-mb-dot{position:absolute;top:50%;width:14px;height:14px;transform:translate(-50%,-50%);background:var(--blue);border:2px solid #fff;border-radius:50%;box-shadow:0 1px 4px rgba(0,82,243,.5)}
.ex-mb-us{position:absolute;top:-17px;transform:translateX(-50%);font-size:10.5px;font-weight:700;color:var(--blue);white-space:nowrap}
.ex-mb-ends{display:flex;justify-content:space-between;font-size:10px;color:var(--tx-3)}
.ex-mb-src{text-align:right;font-size:10.5px;color:var(--tx-2);line-height:1.35}
.ex-mb-more{display:block;width:100%;margin-top:12px;text-align:center;font-family:var(--ff);font-size:12.5px;font-weight:700;color:var(--blue);background:var(--blue-l);border:1px solid var(--blue-b);border-radius:12px;padding:10px;cursor:pointer}
@media(max-width:620px){.ex-mb-row{grid-template-columns:1fr}.ex-mb-src{text-align:left}}

/* ต้นทุนขยับ: ขึ้น = แดง · ลง = เขียว */
.exec-v8.exec-v13 .ex-mv .ex-bar-row{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 64px;gap:10px}
.exec-v8.exec-v13 .ex-mv .ex-bar-row span small{display:block;font-size:10px;color:var(--tx-3)}
.exec-v8.exec-v13 .ex-mv .ex-bar-row.dn .ex-bar i{background:var(--green)}
.exec-v8.exec-v13 .ex-mv .ex-bar-row.dn b{color:var(--green)}
.exec-v8.exec-v13 .ex-mv .ex-bar-row b{text-align:right;font-size:13px}

/* การ์ด KPI ที่ยังไม่มีแหล่งข้อมูล = เทา (ไม่ใช่แดง — ยังไม่รู้ ไม่ได้แปลว่าแย่) */
.exec-v8.exec-v13 .ex-kpi.tone-none{background:#F8FAFC;border-color:var(--line)}
.exec-v8.exec-v13 .ex-kpi.tone-none::before{background:#CBD5E1}
.exec-v8.exec-v13 .ex-kpi.tone-none>b{color:var(--tx-3)}
.exec-v8.exec-v13 .ex-kpi .ex-kpi-badge.none{background:#fff;color:var(--tx-3)}

/* Actual Invoiced Sales (คืนจาก V21) */
.ex-act-head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.ex-act-head h3{margin:0}
.ex-act-head .btn{margin-left:auto}
.ex-act-note{margin:10px 0 0;background:var(--amber-l);border:1px solid var(--amber-b);color:#8A5A00;border-radius:12px;padding:8px 12px;font-size:11.5px}
.ex-act-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0 6px}
.ex-act-kpis>div{border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.ex-act-kpis span{display:block;font-size:11px;color:var(--tx-3)}
.ex-act-kpis b{display:block;font-size:26px;font-weight:700;letter-spacing:-.02em;color:var(--ink);margin-top:3px;font-variant-numeric:tabular-nums}
.ex-act-kpis b.sm{font-size:14px;margin-top:6px}
.ex-act-kpis em{display:block;font-style:normal;font-size:10.5px;color:var(--tx-3);margin-top:3px}
.ex-act-kpis .good{background:var(--green-l);border-color:var(--green-b)}.ex-act-kpis .good b{color:#15803D}
.ex-act-kpis .bad{background:var(--red-l);border-color:var(--red-b)}.ex-act-kpis .bad b{color:#B91C1C}
.ex-act-bars{display:flex;align-items:flex-end;gap:8px;height:170px;padding:22px 0 0;border-bottom:1px solid var(--line)}
.ex-act-bars>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.ex-act-bars i{display:block;width:100%;background:var(--blue);border-radius:6px 6px 0 0;transform-origin:bottom;animation:exGrowY .8s cubic-bezier(.2,.8,.2,1) both}
.ex-act-bars>div.peak i{background:var(--indigo)}
.ex-act-bars em{font-style:normal;font-size:11px;font-weight:700;color:var(--ink);margin-bottom:4px;white-space:nowrap}
.ex-act-mon{display:flex;gap:8px;margin-top:5px}
.ex-act-mon span{flex:1;text-align:center;font-size:10.5px;color:var(--tx-3)}
.ex-act-top{margin-top:16px}
.ex-act-top .lb2{font-size:10.5px;letter-spacing:.12em;font-weight:700;color:var(--tx-3);text-transform:uppercase;margin-bottom:4px}
.ex-act-top .r{display:grid;grid-template-columns:minmax(0,1fr) 110px minmax(0,1.2fr);gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px;align-items:center}
.ex-act-top .r b{text-align:right;font-variant-numeric:tabular-nums}
.ex-act-top .r em{text-align:right;font-style:normal;font-size:11px;color:var(--tx-3)}
@keyframes exGrowY{from{transform:scaleY(0)}}
@media(max-width:900px){.ex-act-kpis{grid-template-columns:repeat(2,1fr)}.ex-act-top .r{grid-template-columns:1fr 90px}.ex-act-top .r em{grid-column:1/-1;text-align:left}}

/* Operation: Delivery เต็มกว้างก่อน แล้วปัญหาลูกค้าใต้ */
.ex-ops-stack{display:flex;flex-direction:column;gap:14px}
.ex-ops-stack .ex-delivery-summary{grid-template-columns:repeat(3,1fr)!important}
.ex-ops-stack .ex-delivery-summary b{font-size:24px!important}
.ex-ex-tag{font-size:9.5px;font-weight:600;color:var(--amber);background:var(--amber-l);border-radius:99px;padding:1px 7px;vertical-align:middle}
.ex-iss-top{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.ex-iss-top h3{margin:0}
.ex-iss-top .act{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ex-seg{display:inline-flex;background:var(--line-2);border-radius:10px;padding:3px}
.ex-seg button{font-family:var(--ff);border:0;background:none;border-radius:8px;padding:5px 12px;font-size:11.5px;font-weight:600;color:var(--tx-2);cursor:pointer}
.ex-seg button.on{background:var(--blue);color:#fff}
.ex-iss-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0}
.ex-iss-kpis>div{border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.ex-iss-kpis span{display:block;font-size:11px;color:var(--tx-3)}
.ex-iss-kpis b{display:block;font-size:28px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.ex-iss-kpis .bad b{color:var(--red)}.ex-iss-kpis .warn b{color:var(--orange)}
.ex-iss-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ex-iss-grid>div{border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.ex-iss-grid h4{font-size:12.5px;margin:0 0 8px}
.ex-iss-bar{display:grid;grid-template-columns:minmax(0,1fr) minmax(60px,1fr) 28px;gap:8px;align-items:center;font-size:11.5px;margin-bottom:6px}
.ex-iss-bar i{display:block;height:7px;border-radius:99px;background:var(--orange)}
.ex-iss-bar b{text-align:right}
.ex-iss-trend{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px}
.ex-iss-trend svg{width:100%;height:auto;display:block}
.ex-iss-trend text{font-family:var(--ff);font-size:10px;fill:var(--tx-3)}
@media(max-width:700px){.ex-iss-grid,.ex-iss-kpis{grid-template-columns:1fr}.ex-ops-stack .ex-delivery-summary{grid-template-columns:1fr!important}}
</style>
<script>
/* Executive v8 — Business Health + Delivery by carrier + pricing snapshot */
var esc = PX.esc, money = PX.money, W = PX.why;
/* ค่าที่ใส่ใน onclick ต้องเป็นสตริง JS ที่ปลอดภัยทั้งในฐานะ JS และ attribute — รหัส/กลุ่มสินค้ามาจากคนพิมพ์ได้ */
function jsq(v) { return JSON.stringify(String(v == null ? '' : v)).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
var ACT_ERR = '';
var D = null, GD = null, SD = null, CG = null, SL = null, ACT = null, FINVIEW = 'revenue', EXEC_VIEW = 'overview';
var EXEC_TAB = 'overview';
var OPSPERF = null, DLV = null, AR = null, PRS = null, ROLE = '', EXC = null, EXC_ERR = '', REPS = [];   /* EXC = /api/exec (Decision Cockpit: AI perf · flow · คอขวด · commercial · margin กลุ่ม · ลูกค้า · เซลล์ · AI เตือนแม่น · automation · decisions) */   /* ข้อมูลจริงจาก /api/ops-perf · deliveries · ar · prospects */
try { EXEC_TAB = sessionStorage.getItem('exec_tab') || 'overview'; } catch(e) {}

PX.shell('exec',
  '<div class="float"><div class="ic">⚡</div><b>Executive actions</b>' +
  '<span id="floatSub">ดูสิ่งที่ต้องจัดการก่อน</span>' +
  '<button onclick="execDetail(\'attention\')">เปิด Attention Queue</button></div>');

/* EX เหลือเฉพาะเกรดลูกค้า (เติมจาก /api/guard) — ตัวเลขผู้บริหารอื่นทั้งหมดมาจาก API จริง: OPSPERF · DLV · AR · PRS · ACT */
var EX = { customerGrades: [], carriers: [] };
/* ข้อมูลส่วนที่รอ source จริง: Attention Queue โหลดจาก DB จริงผ่าน /api/exec-attention */
var EXEC_DECISIONS = [];
function loadAttention() {
  PX.get('/api/exec-attention').then(function(res) {
    EXEC_DECISIONS = (res && res.items) || [];
    var el = document.getElementById('exec-att-db');
    if (!el) return;
    var open = EXEC_DECISIONS.filter(function(x){ return x.status !== 'done'; }), done = EXEC_DECISIONS.filter(function(x){ return x.status === 'done'; });
    if (!EXEC_DECISIONS.length) { el.innerHTML = '<div class="ex-att-empty">ยังไม่มีเรื่องที่มอบหมายไว้ — กด "มอบหมาย" ที่รายการด้านบนเพื่อส่งให้คนรับผิดชอบ</div>'; return; }
    el.innerHTML = '<div class="ex-kpi-row-label" style="margin:10px 0 6px">มอบหมายแล้ว · รอเจ้าของงาน '+open.length+(done.length?' · ปิดแล้ว '+done.length:'')+'</div>'+open.map(function(x) {
      var sev = x.severity === 'high' ? 'red' : x.severity === 'medium' ? 'amber' : 'green';
      return '<div class="ex-att-db-row '+sev+'">'+
        '<span class="ex-att-b"><b>'+esc(x.title)+'</b>'+(x.detail?'<span>'+esc(x.detail)+'</span>':'')+(x.note?'<span>โน้ต: '+esc(x.note)+'</span>':'')+'</span>'+
        '<small>👤 '+esc(x.owner_name||x.owner||'—')+'</small>'+
        (x.due_at?'<small>ภายใน '+esc(x.due_at)+'</small>':'')+
        '<small style="color:var(--tx-3)">มอบหมาย '+esc(String(x.at||'').slice(5,16).replace('T',' '))+'</small>'+
        '<button type="button" class="btn" style="padding:3px 10px;font-size:11.5px" onclick="attDone('+jsq(x.id)+')">ปิดเรื่อง</button></div>';
    }).join('')+(done.length?'<details style="margin-top:6px;font-size:12px;color:var(--tx-3)"><summary style="cursor:pointer">ปิดแล้ว '+done.length+' เรื่อง</summary>'+done.slice(0,10).map(function(x){ return '<div style="padding:3px 0">✓ '+esc(x.title)+' · '+esc(x.owner_name||'')+'</div>'; }).join('')+'</details>':'');
  }).catch(function() {
    var el = document.getElementById('exec-att-db');
    if (el) el.innerHTML = '<div class="ex-att-empty">โหลดข้อมูลไม่ได้ — ลองรีเฟรช</div>';
  });
}

function pct(a,b){ return b ? Math.round(a/b*1000)/10 : 0; }
function mm(n){ return n >= 1000000 ? (n/1000000).toFixed(2)+'M' : n >= 1000 ? Math.round(n/1000)+'K' : money(n); }
/* ปัดก่อนโชว์เสมอ — 12.8-15.0 ใน JS ได้ -2.1999999999999993 แล้วโผล่บนจอทั้งพวง */
function sign(n, suffix){ var v=Math.round(n*10)/10; return (v>0?'+':'') + v + (suffix||''); }
function avgMargin(){
  if (!D || !D.spread) return '—';
  var MID={'<12%':8,'12–15%':13.5,'15–20%':17.5,'20–30%':25,'30%+':35}, n=0,s=0;
  D.spread.forEach(function(x){n+=x.n;s+=x.n*(MID[x.band]||0);});
  return n ? (s/n).toFixed(1) : '—';
}
function safe(v, fb){ return v===0 || v ? v : fb; }
function bandClass(n){ var f=(D&&D.floorPct)||12; return n<f?'red':n<15?'amber':n<30?'green':'blue'; }
function fmtMoney(n){ return '฿'+money(n); }
function recentDrift(){ var d=(D&&D.drift)||[]; return d.slice(Math.max(0,d.length-7)); }
function sparkline(points){
  if(!points || !points.length) return '';
  /* กราฟนี้ต้องยืดสูงได้ตามการ์ด แต่ "ตัวหนังสือกับจุดห้ามยืดตาม"
     ท่าเดิมยัดทุกอย่างไว้ใน SVG แล้วสั่ง preserveAspectRatio="none" — เส้นสวยดี
     แต่ตัวเลขแบนและจุดกลมกลายเป็นวงรีตามส่วนสูงที่ยืด
     ท่าใหม่: SVG วาดแค่ "เส้น" (non-scaling-stroke กันเส้นหนาผิดส่วน)
     ส่วนจุด/ตัวเลข/ชื่อรอบ เป็น HTML วางทับด้วย % — ยืดการ์ดแค่ไหนก็คมเท่าเดิม */
  var n=points.length, vals=points.map(function(x){return +x.cost||0;});
  var min=Math.min.apply(null,vals), max=Math.max.apply(null,vals); if(min===max){min-=1;max+=1;}
  var L=7, R=7;                       /* เว้นขอบซ้ายขวา ไม่ให้ตัวเลขหัวท้ายโดนตัด */
  var TOP=16, BOT=76;                 /* เส้นเดินอยู่ในแถบนี้ เหลือที่บนให้ตัวเลข ล่างให้ชื่อรอบ */
  function X(i){ return n===1 ? 50 : L + (100-L-R)*(i/(n-1)); }
  function Y(v){ return BOT - ((v-min)/(max-min))*(BOT-TOP); }
  var poly=points.map(function(x,i){ return X(i).toFixed(2)+','+Y(+x.cost||0).toFixed(2); }).join(' ');
  var dots=points.map(function(x,i){
    var last=(i===n-1), y=Y(+x.cost||0);
    return '<i class="ex-sp-dot'+(last?' last':'')+'" style="left:'+X(i).toFixed(2)+'%;top:'+y.toFixed(2)+'%"></i>'+
           '<b class="ex-sp-val'+(last?' last':'')+'" style="left:'+X(i).toFixed(2)+'%;top:'+y.toFixed(2)+'%">'+safe(x.cost,'—')+'</b>';
  }).join('');
  /* รอบเยอะเมื่อไหร่ชื่อรอบจะชนกัน — เกิน 8 รอบก็โชว์เว้นอัน แต่รอบล่าสุดโชว์เสมอ */
  var lw=0; points.forEach(function(x){ lw=Math.max(lw,(x.label||'').length); });
  var every = (n*(lw*6.2) > 580 || n>8) ? 2 : 1;
  var axis=points.map(function(x,i){
    if(i%every && i!==n-1) return '';
    return '<u class="ex-sp-x" style="left:'+X(i).toFixed(2)+'%">'+esc((x.label||'').replace('_26',''))+'</u>';
  }).join('');
  return '<div class="ex-spark">'+
    '<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">'+
      '<polyline fill="none" stroke="#0052F3" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" points="'+poly+'"></polyline>'+
    '</svg>'+dots+axis+'</div>';
}

function bindExecActions(root){

  });
  base.querySelectorAll('[data-go-route]').forEach(function(el){

    el.dataset.boundGo='1';

      execResolve(el.dataset.resolveAction);

function marketRow(b){
  var us=+b.us||0, lo=+b.lo||0, hi=+b.hi||0;
  var a=Math.min(lo,us), z=Math.max(hi,us), pad=(z-a)*0.25||Math.max(3,us*0.06);
  var d0=a-pad, dw=(z+pad-d0)||1;
  function X(v){return Math.max(0,Math.min(100,(v-d0)/dw*100)).toFixed(1);}
  var bandW=Math.max(1.5,parseFloat(X(hi))-parseFloat(X(lo))).toFixed(1);

function ktileSpark(arr){
  if(!arr || arr.length<2) return '<svg viewBox="0 0 92 40" aria-hidden="true"><line x1="0" y1="20" x2="92" y2="20" stroke="rgba(255,255,255,.35)" stroke-dasharray="3 4"/></svg>';
  var w=92,h=40,mx=Math.max.apply(null,arr),mn=Math.min.apply(null,arr),sp=(mx-mn)||1;
  var pts=arr.map(function(v,i){return (i*(w/(arr.length-1))).toFixed(1)+','+(4+(1-(v-mn)/sp)*(h-8)).toFixed(1);});
  var last=pts[pts.length-1].split(',');
  return '<svg viewBox="0 0 '+w+' '+h+'" aria-hidden="true"><polyline points="'+pts.join(' ')+'" fill="none" stroke="rgba(255,255,255,.9)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>'+
    '<circle cx="'+last[0]+'" cy="'+last[1]+'" r="3.2" fill="#fff"/></svg>';

function parseCSV(text){
  var rows=[],row=[],f='',q=false,i,c;
  text=text.replace(/^﻿/,'');
  for(i=0;i<text.length;i++){c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true; else if(c===','){row.push(f);f='';} else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=''; }
    else f+=c; }
  if(f!==''||row.length){row.push(f);rows.push(row);}
  return rows.filter(function(r){return r.some(function(x){return String(x).trim()!=='';});});
}
function loadXLSX(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise(function(ok,no){var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=function(){ok(window.XLSX);};s.onerror=function(){no(new Error('โหลดตัวอ่าน Excel ไม่ได้ — ลอง Save as CSV แล้วนำเข้าแทน'));};document.head.appendChild(s);});
}
function readTable(file){
  if(/\.(xlsx|xls)$/i.test(file.name))
    return loadXLSX().then(function(X){return file.arrayBuffer().then(function(b){
      var wb=X.read(b,{type:'array',cellDates:true}), ws=wb.Sheets[wb.SheetNames[0]];
      var z=function(n){return String(n).padStart(2,'0');};
      return X.utils.sheet_to_json(ws,{header:1,raw:true,defval:''}).map(function(r){ return r.map(function(v){
        if(!(v instanceof Date)) return v;
        return v.getFullYear()<1901 ? z(v.getHours())+':'+z(v.getMinutes())                       /* ช่องเวลาอย่างเดียว */
                                    : v.getFullYear()+'-'+z(v.getMonth()+1)+'-'+z(v.getDate());   /* ช่องวันที่ */
      }); });
    });});
  return file.text().then(parseCSV);
}
